<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0B0B0C">
  <title>CamelAML</title>
  <meta name="description" content="CamelAML — master AML, think like an analyst. A transaction monitoring and AML investigation simulator.">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CamelAML">
  <meta property="og:title" content="CamelAML">
  <meta property="og:description" content="Master AML. Think like an analyst.">
  <meta property="og:image" content="/brand/og-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    /* first paint, before the stylesheet arrives */
    html,body{margin:0;background:#0B0B0C}
    .splash{position:fixed;inset:0;display:grid;place-items:center;background:#0B0B0C}
    .splash img{width:56px;height:56px;animation:splash 1.2s ease-in-out infinite alternate}
    @keyframes splash{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion: reduce){.splash img{animation:none}}
  </style>
</head>
<body>
  <div id="app"><div class="splash" aria-label="Loading CamelAML"><img src="/brand/mark-dark.png" alt=""></div></div>
  <div id="layer" aria-live="polite"></div>
  <noscript>CamelAML is an interactive web app and needs JavaScript enabled.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
