  const I = inst(instId), ccy = I.ccy;
  const level = opts.level || rInt(rnd, 1, 5);
  let pats = GEN_PATTERNS.slice();
  if (opts.pattern) pats = pats.filter(p => p.p === opts.pattern);
  if (opts.outcome) pats = pats.filter(p => p.out === opts.outcome);
  if (!pats.length) pats = GEN_PATTERNS.slice();
  const P = rPick(rnd, pats);
  const unit = ccy === "INR" ? rInt(rnd, 9000, 46000) : ccy === "USD" || ccy === "GBP" || ccy === "EUR" ? rInt(rnd, 900, 4600) : rInt(rnd, 900, 4600);
  const threshold = I.thresholds.cash;
  const occ = rPick(rnd, GEN_OCC);
  const pool = ccy === "INR" ? "IN" : ccy === "GBP" ? "UK" : ccy === "EUR" ? "EU" : "US";
  const nm = nameGen(rnd, pool);
  const legit = P.out === "close";
  const monthly = Math.round(unit * rInt(rnd, 2, 5));

  const seed = {
    id, kind:"generated", level, inst:instId, ccy, rule:P.rule, outcome:P.out,
    title: (legit ? "Explained step-change — " : "") + P.p.charAt(0).toUpperCase() + P.p.slice(1) + " pattern — " + occ.toLowerCase(),
    priority: level >= 4 ? "critical" : level >= 2 ? "high" : "medium",
    cust:{ name:nm, age:String(rInt(rnd,24,63)), since: rPick(rnd,["Mar 2018","Jul 2020","Nov 2021","Feb 2023","Sep 2019","Jan 2017"]),
      occ:occ, employer: legit ? "Self-employed — " + occ.toLowerCase() : "Self-employed", income: money(monthly, ccy) + " per month (declared)",
      city: rPick(rnd, I.geos), cc: ccy === "INR" ? "IN" : ccy === "GBP" ? "GB" : ccy === "EUR" ? "DE" : "US",
      ctype: rPick(rnd, I.customerTypes), risk: level >= 4 ? "high" : "low", product: rPick(rnd, I.products),
      expTurn: money(monthly, ccy) + " – " + money(Math.round(monthly*1.6), ccy) + " per month",
      expTypes:"Trading receipts, supplier payments, personal drawings", expCtry: I.geos.slice(0,2).join(" and "),
      expCps:"A stable set of trade counterparties and one payroll relationship",
      expCash: threshold ? "Modest — below " + money(Math.round(threshold*0.3), ccy) + " per month" : "None expected",
      sof: occ + " income", sow:"Business ownership", kycDate: rPick(rnd,["2021","2022","2023"]),
      priorAlerts: rnd() > 0.7 ? "One prior alert closed without escalation" : "None recorded",
      summary:"a " + occ.toLowerCase() + " with a declared monthly turnover of " + money(monthly, ccy) + "." },
    gen:{ start: iso(addD(new Date(), -rInt(rnd, 40, 200))), pool, cc: ccy === "INR" ? "IN" : ccy === "GBP" ? "GB" : ccy === "EUR" ? "DE" : "US",
      openBal: monthly, sites:["Main branch","North branch","Retail park branch","City centre branch"],
      flow: P.flow(rnd, P.p === "structuring" ? threshold : unit) },
    explain: legit
      ? "\"The large receipt is the completion money from selling my previous property. My solicitor sent it and I moved it straight into an investment account. I can send you the completion statement.\""
      : rPick(rnd, ["\"This is all normal business for me, trade has been busy. I can get you invoices if you need them.\"",
          "\"A friend asked me to move some money for him because his own account was frozen. I did not take anything for it.\"",
          "\"These are payments from customers. I do not always issue an invoice for small jobs.\"",
          "\"I am investing on behalf of some family members, we pool the money together.\""]),
    proof: legit
      ? "Customer produced the solicitor's completion statement, the land registry entry for the sale, and the investment platform confirmation. All three reconcile to the account to the currency unit."
      : rPick(rnd, ["Nothing was produced within the period allowed.",
          "Two invoices were produced. Neither carries a tax registration number and neither counterparty can be traced.",
          "A handwritten list of names and amounts was produced with no supporting records."]),
    flags: legit
      ? [{k:"volume",t:"A single receipt many times the size of any prior credit"},{k:"newcp",t:"Counterparty not previously seen on the relationship"}]
      : [{k:P.p,t:"Activity matches the " + P.p + " pattern the rule was written to detect"},
         {k:"profile",t:"Turnover materially above the profiled expectation of " + money(monthly, ccy) + " a month"},
         {k:"unrelated",t:"Counterparties do not appear in the customer's declared expected-counterparty list"},
         {k:"docs",t:"No documentation was produced that reconciles to the account"}],
    traps: legit
      ? [{t:"A large one-off receipt is not an indicator once its source is evidenced. Property completion proceeds arriving from a solicitor's client account are among the most readily verifiable sources there are."}]
      : [{t:"The channel and the product are ordinary for this customer segment. The pattern is what matters, not the payment rail."}],
    typology: P.typ,
    reveal:{ what:"A practice case generated to exercise the " + P.p + " pattern at level " + level + " in a " + I.short.toLowerCase() + " context.",
      facts:"Entirely fictional. Generated for practice. The pattern reflects typologies described in published FATF and FIU material; no real case, institution or person is depicted.",
      sources:[{ l:"FATF — methods and trends", u:"https://www.fatf-gafi.org/en/publications/Methodsandtrends.html" }] }
  };
  GENERATED[id] = seed;
  CASE_INDEX.push({ id, kind:"generated", level, inst:instId, title:seed.title, rule:P.rule,
    outcome:P.out, priority:seed.priority, src:"generated" });
  saveProg();
  return id;
}

}
function dl(pairs){
  return '<dl class="dl">' + pairs.filter(p => p && p[1] != null && p[1] !== "")
    .map(p => '<dt>' + esc(p[0]) + '</dt><dd>' + (p[2] === "html" ? p[1] : esc(p[1])) + '</dd>').join("") + '</dl>';
}
function tile(k, v, m, accent){
  return '<div class="tile' + (accent ? " accent-" + accent : "") + '"><div class="k">' + esc(k) + '</div>' +
    '<div class="v' + (String(v).length > 9 ? " sm" : "") + '">' + esc(String(v)) + '</div>' +
    (m ? '<div class="m">' + esc(m) + '</div>' : "") + '</div>';
}
function card(title, body, right, cls){
  return '<section class="card ' + (cls||"") + '">' +
    (title ? '<div class="card-h"><h3>' + esc(title) + '</h3>' + (right || "") + '</div>' : "") +

}
function cardFlush(title, body, right){

    '<div class="card-b flush">' + body + '</div></section>';
}
function empty(glyph, head, body, action){
  return '<div class="empty"><div class="big" aria-hidden="true">' + glyph + '</div><h3>' + esc(head) + '</h3>' +
    '<p>' + esc(body) + '</p>' + (action || "") + '</div>';
}
function bars(rows, max){
  max = max || Math.max.apply(null, rows.map(r => r[1]).concat([1]));
  return rows.map(r => '<div class="scorebar"><span>' + esc(r[0]) + '</span>' +
    '<span class="bar"><i style="width:' + Math.round(r[1]/max*100) + '%' + (r[2] ? ';background:var(--' + r[2] + ')' : '') + '"></i></span>' +
    '<span class="right num tiny">' + esc(String(r[3] != null ? r[3] : r[1])) + '</span></div>').join("");
}
function sparkline(values, w, h){
  w = w || 260; h = h || 44;
  if (!values.length) return "";
  const max = Math.max.apply(null, values.concat([1])), min = Math.min.apply(null, values.concat([0]));
  const rng = Math.max(1, max - min);
  const pts = values.map((v,i) => [ (i/(Math.max(1,values.length-1)))*w, h - ((v-min)/rng)*(h-6) - 3 ]);
  const d = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="Score trend">' +
    '<path d="' + d + '" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    pts.map(p => '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.2" fill="var(--blue)"/>').join("") +
    '</svg>';
}

function filterRows(rows){
  const f = S.filters;
  return rows.filter(r => {
    const c = r.c;
    if (f.q){ const q = f.q.toLowerCase();
      if ((c.alert.ref + " " + c.customer.name + " " + c.title + " " + rule(c.alert.ruleId).name + " " + c.customer.id)
          .toLowerCase().indexOf(q) < 0) return false; }
    if (f.risk && c.alert.risk !== f.risk) return false;
    if (f.priority && c.alert.priority !== f.priority) return false;
    if (f.status && r.w.status !== f.status) return false;
    if (f.rule && c.alert.ruleId !== f.rule) return false;
    if (f.level && String(c.level) !== f.level) return false;
    if (f.country && c.alert.countries.indexOf(f.country) < 0) return false;
    if (f.sla === "overdue" && !r.sla.overdue) return false;
    if (f.sla === "risk" && (r.sla.overdue || r.sla.usedPct < 0.75)) return false;
    if (f.sla === "ok" && r.sla.usedPct >= 0.75) return false;
    return true;
  });
}
function sortRows(rows){
  const k = S.sort.key, a = S.sort.asc ? 1 : -1;
  const val = r => k === "sla" ? r.sla.left
    : k === "amount" ? r.c.alert.amount
    : k === "priority" ? PRIORITY[r.c.alert.priority].order
    : k === "risk" ? ["low","medium","high","critical"].indexOf(r.c.alert.risk)
    : k === "status" ? STATUS[r.w.status].order
    : k === "customer" ? r.c.customer.name.toLowerCase()
    : k === "date" ? r.c.alert.date
    : k === "level" ? r.c.level
    : r.c.alert.ref;
  return rows.slice().sort((x,y) => { const vx = val(x), vy = val(y);
    return (vx < vy ? -1 : vx > vy ? 1 : 0) * a; });
}
function th(key, label, num){
  const on = S.sort.key === key;
  return '<th class="sortable' + (num ? " num" : "") + '" data-act="sort" data-id="' + key + '" ' +
    'aria-sort="' + (on ? (S.sort.asc ? "ascending" : "descending") : "none") + '">' + esc(label) +
    (on ? '<span class="arrow" aria-hidden="true">' + (S.sort.asc ? "↑" : "↓") + '</span>' : "") + '</th>';
}

function applyTxnFilters(c){
  const f = S.txnF;
  let t = c.txns.filter(x => {
    if (f.q){ const q = f.q.toLowerCase();
      if ((x.cp + " " + x.desc + " " + x.m + " " + (x.note||"") + " " + (x.loc||"") + " " + x.id).toLowerCase().indexOf(q) < 0) return false; }
    if (f.dir && x.dir !== f.dir) return false;
    if (f.cc && x.cc !== f.cc) return false;
    if (f.method && x.m !== f.method) return false;
    if (f.channel && x.ch !== f.channel) return false;
    if (f.cp && x.cp !== f.cp) return false;
    if (f.min && x.amt < Number(f.min)) return false;
    if (f.max && x.amt > Number(f.max)) return false;
    if (f.from && x.d < f.from) return false;
    if (f.to && x.d > f.to) return false;
    return true;
  });
  const k = f.sort, a = f.asc ? 1 : -1;
  t.sort((x,y) => { const vx = k === "amt" ? x.amt : k === "cp" ? x.cp.toLowerCase() : k === "bal" ? x.bal : (x.d + x.t);
    const vy = k === "amt" ? y.amt : k === "cp" ? y.cp.toLowerCase() : k === "bal" ? y.bal : (y.d + y.t);
    return (vx < vy ? -1 : vx > vy ? 1 : 0) * a; });
  return t;
}

/* --------------------------------------------------------------------------
   21. Entity search — graph, counterparty 360, beneficiary investigation
        (§10, §11, §12)
   -------------------------------------------------------------------------- */
const NODE_COLOR = { customer:"#0a84ff", entity:"#af52de", party:"#30b0c7", cash:"#a55a00", address:"#8e8e93" };
const NODE_SHAPE = { customer:"Account under review", entity:"Company", party:"Individual", cash:"Cash channel", address:"Shared attribute" };

/* shape carries the node kind, so the graph does not rely on colour alone */
function nodeShape(kind, x, y, r, col){
  if (kind === "entity")   return '<rect x="' + (x-r) + '" y="' + (y-r*0.82) + '" width="' + (r*2) + '" height="' + (r*1.64) + '" rx="4" fill="' + col + '22" stroke="' + col + '" stroke-width="2"/>';
  if (kind === "cash")     return '<path d="M' + x + ' ' + (y-r) + ' L' + (x+r) + ' ' + (y+r*0.72) + ' L' + (x-r) + ' ' + (y+r*0.72) + ' Z" fill="' + col + '22" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/>';
  if (kind === "address")  return '<rect x="' + (x-r) + '" y="' + (y-r*0.45) + '" width="' + (r*2) + '" height="' + (r*0.9) + '" rx="3" fill="' + col + '22" stroke="' + col + '" stroke-width="2" stroke-dasharray="4 3"/>';
  if (kind === "customer") return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '1f" stroke="' + col + '" stroke-width="2.5"/>' +
                                  '<circle cx="' + x + '" cy="' + y + '" r="' + (r*0.52) + '" fill="none" stroke="' + col + '" stroke-width="2"/>';
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '22" stroke="' + col + '" stroke-width="2"/>';
}

function graphSVG(c){
  const g = c.graph;
  const others = g.nodes.filter(n => n.id !== "CUST");
  const inN  = others.filter(n => g.edges.some(e => e.a === n.id && e.b === "CUST"));
  const outN = others.filter(n => g.edges.some(e => e.a === "CUST" && e.b === n.id) && inN.indexOf(n) < 0);
  const rest = others.filter(n => inN.indexOf(n) < 0 && outN.indexOf(n) < 0);

  const rowH = 62, pad = 56;
  const maxCol = Math.max(inN.length, outN.length, 1);
  const W = 940;
  const H = clamp(pad*2 + maxCol*rowH + (rest.length ? 96 : 0), 380, 1500);
  const cx = W/2, cy = pad + (maxCol*rowH)/2;
  const R = { CUST:26 }, pos = { CUST:[cx, cy] };

  function place(list, xMid){
    const top = cy - ((list.length-1)*rowH)/2;
    list.forEach((n,i) => {
      pos[n.id] = [ xMid + (i % 2 ? 46 : -46) * (xMid < cx ? 1 : -1), top + i*rowH ];
      R[n.id] = 16;
    });
  }
  place(inN, 168); place(outN, W-168);
  rest.forEach((n,i) => { pos[n.id] = [cx - ((rest.length-1)*120)/2 + i*120, cy + (maxCol*rowH)/2 + 62]; R[n.id] = 15; });

  /* stop each edge at the node boundary so the arrowhead is visible */
  function trim(a, b, rb){
    const dx = b[0]-a[0], dy = b[1]-a[1], d = Math.sqrt(dx*dx+dy*dy) || 1;
    return [ b[0] - dx/d*(rb+7), b[1] - dy/d*(rb+7) ];
  }

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Relationship graph for ' + esc(c.customer.name) + '">';
  s += '<defs><marker id="ar" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="5.5" markerHeight="5.5" orient="auto">' +
       '<path d="M0 0 L9 4.5 L0 9 z" fill="var(--label-3)"/></marker></defs>';

  g.edges.forEach((e, ei) => {
    const a0 = pos[e.a], b0 = pos[e.b]; if (!a0 || !b0) return;
    const b1 = trim(a0, b0, R[e.b] || 16);
    const a1 = trim(b0, a0, R[e.a] || 16);
    s += '<path class="gedge" d="M' + a1[0].toFixed(1) + ' ' + a1[1].toFixed(1) + ' L' + b1[0].toFixed(1) + ' ' + b1[1].toFixed(1) + '" ' +
      'stroke="var(--label-4)" stroke-width="' + (e.v ? clamp(1.2 + Math.log10(Math.max(10,e.v))/2.2, 1.2, 4.5).toFixed(1) : 1.4) + '" ' +
      (e.dashed ? 'stroke-dasharray="5 4" ' : "") + 'marker-end="url(#ar)"/>';
    if (e.label){
      const t = 0.34;
      const lx = a1[0] + (b1[0]-a1[0])*t, ly = a1[1] + (b1[1]-a1[1])*t;
      s += '<text x="' + lx.toFixed(1) + '" y="' + (ly-5).toFixed(1) + '" text-anchor="middle" fill="var(--label-2)" ' +
           'font-size="9" font-weight="600" paint-order="stroke" stroke="var(--surface-2)" stroke-width="3">' + esc(e.label) + '</text>';
    }
  });

  g.nodes.forEach(n => {
    const p = pos[n.id]; if (!p) return;
    const col = NODE_COLOR[n.kind] || "#8e8e93";
    const r = R[n.id] || 16;
    const label = n.label.length > 20 ? n.label.slice(0,18) + "\u2026" : n.label;
    s += '<g class="gnode" data-act="gnode" data-id="' + esc(n.id) + '" tabindex="0" role="button" aria-label="' +
         esc(n.label + " — " + (NODE_SHAPE[n.kind]||"party")) + '">';
    s += nodeShape(n.kind, p[0], p[1], r, col);
    s += '<text x="' + p[0] + '" y="' + (p[1]+r+13) + '" text-anchor="middle" fill="var(--label)" ' +
         'paint-order="stroke" stroke="var(--surface-2)" stroke-width="3">' + esc(label) + '</text>';
    if (n.sub) s += '<text x="' + p[0] + '" y="' + (p[1]+r+23) + '" text-anchor="middle" fill="var(--label-3)" font-size="8.5" ' +
         'paint-order="stroke" stroke="var(--surface-2)" stroke-width="3">' + esc(n.sub) + '</text>';
    s += '</g>';
  });
  s += '</svg>';
  return s;
}

function viewEntity(){
  const c = getCase(S.active); if (!c) return needCase();
  const w = work(c.id); w.viewed.add("entities"); markSeen(c, "Counterparty and entity records reviewed", "entity");

  const cps = c.counterparties;

    '<span class="tiny">Select any node to investigate it</span></div>' +

    '<div class="glegend">' + Object.keys(NODE_COLOR).map(k =>
      '<span><i style="background:' + NODE_COLOR[k] + ';border-radius:' + (k==="entity"?"2px":k==="address"?"1px":"50%") + '"></i>' +
      (k === "customer" ? "Customer / account (ringed circle)" : k === "entity" ? "Company (square)" :
       k === "party" ? "Individual counterparty (circle)" : k === "cash" ? "Cash channel (triangle)" :
       "Shared attribute (dashed)") + '</span>').join("") +
    '<span class="tb-grow"></span><span>Edge width reflects value moved. Dashed edges are non-payment links such as a shared address, ' +
    'telephone number, director or device.</span></div></div>';

  h += '<div class="callout" style="margin-bottom:16px">The graph shows relationships. It does not interpret them. ' +
    'A dense network is not evidence of anything on its own — establish what each link is, and whether it has an ordinary ' +
    'commercial or personal explanation, before you draw a conclusion from the shape.</div>';

  h += '<section class="card"><div class="card-h"><h3>Counterparties</h3><span class="tiny">' + cps.length + ' identified</span></div>' +
    '<div class="card-b flush"><div class="tw"><table class="tbl"><thead><tr>' +

        x.type === "entity" ? "purple" : x.type === "cash" ? "brown" : "teal") + '</td>' +
      '<td class="nowrap">' + esc(ctryName(x.cc)) + (isHighRisk(x.cc) ? ' ' + pill("Higher risk","orange") : "") + '</td>' +
      '<td class="num credit">' + (x.inV ? esc(money(x.inV, c.ccy)) : "—") + '</td>' +
      '<td class="num debit">' + (x.outV ? esc(money(x.outV, c.ccy)) : "—") + '</td>' +
      '<td class="num">' + x.n + '</td>' +
      '<td class="nowrap dim">' + esc(fmtDateShort(x.first)) + '</td>' +
      '<td class="nowrap dim">' + esc(fmtDateShort(x.last)) + '</td>' +
      '<td>' + (x.benign ? pill("Declared","green") : pill("Not declared","")) + '</td></tr>').join("") +
    '</tbody></table></div></div></section>';

  const benes = c.beneficiaries;
  if (benes.length) h += '<section class="card"><div class="card-h"><h3>Beneficiaries</h3>' +
    '<span class="tiny">Payees the customer sent value to</span></div><div class="card-b flush"><div class="tw">' +
    '<table class="tbl"><thead><tr><th>Beneficiary</th><th>Country</th><th>Account</th><th>Added to payee list</th>' +
    '<th class="num">Payments</th><th class="num">Total</th><th>Stated purpose</th></tr></thead><tbody>' +
    benes.map(b => '<tr class="clickable" data-act="entity" data-id="' + c.counterparties.findIndex(x=>x.name===b.name) + '">' +
      '<td style="font-weight:540">' + esc(b.name) + '</td><td>' + esc(ctryName(b.cc)) + '</td>' +

      '<td class="num">' + b.n + '</td><td class="num">' + esc(money(b.total, c.ccy)) + '</td>' +
      '<td class="dim">' + esc(b.purpose) + '</td></tr>').join("") +
    '</tbody></table></div></div></section>';
  return h;
}

function entityDetail(c, idx){
  const x = c.counterparties[Number(idx)];
  if (!x) { S.entityView = null; return viewEntity(); }
  const rows = c.txns.filter(t => t.cp === x.name);
  const bene = c.beneficiaries.find(b => b.name === x.name);
  let h = '<div class="row" style="margin-bottom:14px"><button class="btn sm" data-act="entity-back">← All entities</button>' +
    '<span class="tb-grow"></span>' + pill(x.type === "entity" ? "Company" : x.type === "cash" ? "Cash channel" : "Individual",
      x.type === "entity" ? "purple" : x.type === "cash" ? "brown" : "teal") + '</div>';

  h += '<div class="grid g-side"><div class="stack">' +
    card(x.name, dl([
      ["Name", x.name],
      ["Type", x.type === "entity" ? "Company / legal entity" : x.type === "cash" ? "Cash channel (not a party)" : "Individual"],
      ["Customer of this institution", x.customer ? "Yes" : "No — information limited to what the payment messages and public records show"],
      ["Country", ctryName(x.cc) + (isHighRisk(x.cc) ? " — on the institution's higher-risk jurisdiction list" : "")],
      ["Occupation / business", x.biz || "Not established from available records"],
      ["Relationship to the customer", x.rel],
      ["Transaction volume", money(x.total, c.ccy) + " (" + money(x.inV, c.ccy) + " in, " + money(x.outV, c.ccy) + " out)"],
      ["Transaction frequency", x.n + " transactions over " + Math.max(1, Math.round((new Date(x.last)-new Date(x.first))/86400000)) + " days"],
      ["First transaction", fmtDate(x.first)],
      ["Most recent transaction", fmtDate(x.last)],
      ["Payment methods used", x.methods.join(", ")],
      ["Related accounts", x.accounts || "None identified from the records held"],
      ["Screening result", x.screening]
    ])) ;
  if (bene) h += card("Beneficiary record", dl([
      ["Beneficiary name", bene.name], ["Account", bene.account],
      ["Date added to the payee list", bene.added ? fmtDate(bene.added) : "Not held on the payee record"],
      ["Payments made", bene.n + " totalling " + money(bene.total, c.ccy)],
      ["First payment", fmtDate(bene.first)], ["Most recent payment", fmtDate(bene.last)],
      ["Payment purpose stated by the customer", bene.purpose],
      ["Relationship stated by the customer", bene.rel]
    ]) + (bene.added ? '<div class="callout ' + (daysBetween(bene.added, bene.first) <= 2 ? "warn" : "") + '" style="margin-top:12px">' +
      'Time between the payee being added and first used: <strong>' + daysBetween(bene.added, bene.first) + ' day(s)</strong>.' +
      (daysBetween(bene.added, bene.first) <= 2 ? " A payee added and used immediately is worth asking the customer about; it is not conclusive on its own." : "") +
      '</div>' : ""));

  if (x.note) h += card("Investigation note on this entity", '<p>' + esc(x.note) + '</p>');
  if (x.flags && x.flags.length) h += card("Risk indicators recorded against this entity",
    '<ul style="margin:0;padding-left:18px">' + x.flags.map(f => '<li>' + esc(f) + '</li>').join("") + '</ul>');

  h += cardFlush("Transactions with this entity", '<div class="tw"><table class="tbl dense"><thead><tr>' +
    '<th>ID</th><th>Date</th><th class="num">Amount</th><th>Dir</th><th>Method</th><th>Description</th><th class="num">Balance</th>' +
    '</tr></thead><tbody>' + rows.map(t => '<tr class="clickable" data-act="txndetail" data-id="' + t.id + '">' +
      '<td class="mono dim2">' + t.id + '</td><td class="nowrap">' + esc(fmtDateShort(t.d)) + ' <span class="dim2">' + esc(t.t) + '</span></td>' +
      '<td class="num ' + (t.dir==="C"?"credit":"debit") + '">' + esc(money(t.amt, c.ccy)) + '</td>' +
      '<td>' + pill(t.dir==="C"?"Cr":"Dr", t.dir==="C"?"green":"red") + '</td>' +
      '<td class="dim">' + esc(t.m) + '</td><td class="dim">' + esc(t.desc||"—") + '</td>' +
      '<td class="num">' + esc(money(t.bal, c.ccy)) + '</td></tr>').join("") + '</tbody></table></div>');
  h += '</div>';

  h += '<div class="stack">' +
    card("What this record can and cannot tell you",
      '<p class="tiny">Where a counterparty is not a customer of this institution, the information available is limited to what ' +
      'the payment messages carry and what public records show. Absence of adverse information about a non-customer is not ' +
      'evidence that the counterparty is legitimate — it usually means nothing has been looked for.</p>' +
      '<p class="tiny">Some counterparties in this case are entirely legitimate. Some are not. Some will look suspicious and ' +
      'turn out to have an ordinary explanation. Test each one rather than reading the network as a whole.</p>') +
    card("Ask about this entity",
      '<div class="btn-row"><button class="btn sm" data-act="nav" data-id="cases">Open investigation actions</button>' +
      '<button class="btn sm" data-act="notefor" data-id="' + esc(x.name) + '">Record a note on this entity</button></div>');
  h += '</div></div>';
  return h;
}
function daysBetween(a, b){ return Math.max(0, Math.round((new Date(b) - new Date(a)) / 86400000)); }

/* --------------------------------------------------------------------------
   22. Case file — triage, investigation, decision, disposition
        (§5, §7, §14, §15, §16, §19, §20)
   -------------------------------------------------------------------------- */
function needCase(){
  return card("", empty("▣", "No alert is open",
    "Open an alert from the queue to work it. Customer 360, the transaction ledger, entity records, notes and evidence all operate on the alert you have open.",
    '<button class="btn primary" data-act="nav" data-id="queue">Go to the alert queue</button>'));
}
function markSeen(c, text, key){
  const w = work(c.id);
  if (w.status === "assigned" || w.status === "new"){ w.status = "investigating"; w.startedAt = w.startedAt || Date.now(); logIt(c.id, "Investigation started", "k"); }
  if (!w._seen) w._seen = {};
  if (!w._seen[key]){ w._seen[key] = 1; logIt(c.id, text); }
}
function askedIds(w){ return (w.asked||[]).map(a => a.id); }

/* --- evidence documents (§13) -------------------------------------------- */
function caseDocs(c){
  if (c.docs && c.docs.length) return c.docs;
  const cu = c.customer, ccy = c.ccy, st = c.stats;
  const clean = c.outcome === "close";
  const monthly = /per month/i.test(cu.income) ? cu.income : cu.income;
  return [
    { id:"d1", type:"Payslip / income record", title:"Income records — 3 months",
      body:"Employer or platform records for the three months preceding the review period. Aggregate income for the period: " +
        (cu.income || "not stated") + ". Aggregate credits to the account in the review period: " + money(st.inV, ccy) + ".",
      consistent: clean, note: clean ? "Reconciles to the credits recorded on the account." :
        "Does not account for the value credited in the review period." },
    { id:"d2", type:"Bank statement (external)", title:"Statement from another institution",
      body: clean ? "Statement shows the funding movement leaving the customer's own account at another institution on the date it arrived here, in the same amount." :
        "Statement covers a different period from the one requested and does not show the origin of the funds credited here.",
      consistent: clean, note: clean ? "Origin of funds is traceable to an account in the customer's own name." :
        "Requested period was not supplied; origin remains unestablished." },
    { id:"d3", type:"Source of wealth declaration", title:"Source of wealth — customer statement",
      body:"Declared source of wealth: " + (cu.kyc.sow || "not stated") + ".",
      consistent: clean, note: clean ? "Supported by the documents produced." : "Declaration only. No supporting record has been produced." },
    { id:"d4", type: clean ? "Sale agreement / completion statement" : "Invoice",
      title: clean ? "Completion statement / sale agreement" : "Commercial invoice produced by the customer",
      body: clean ? "Signed agreement and completion statement showing consideration, parties and date. Values and dates reconcile to the credits on the account." :
        "Invoice carries no tax registration number, no delivery terms and no bank details matching the counterparty paid. The counterparty named cannot be traced at the address given.",
      consistent: clean, note: clean ? "Independently verifiable against a public register." : "Cannot be verified; internally inconsistent with the payment record." }
  ];
}

/* --- alert overview ------------------------------------------------------ */
function alertOverview(c){
  const r = rule(c.alert.ruleId), st = c.stats, w = work(c.id);
  const trigger = c.alert.trigger || ("Alert generated because " + st.nIn + " credits totalling " + money(st.inV, c.ccy) +
    " were received from " + c.counterparties.filter(x=>x.inV>0).length + " counterparties over " + st.days +
    " days, followed by " + money(st.outV, c.ccy) + " in outgoing value across " + st.nOut + " debits, against a profiled expectation of " +
    c.customer.expected.turnover + ".");
  let h = '';
  h += card("Why was this alert generated?",
    '<p style="font-size:var(--t-head);line-height:1.6">' + esc(trigger) + '</p>' +
    '<hr class="sep">' +
    dl([["Rule", r.code + " — " + r.name],
        ["What the rule measures", r.mech],
        ["What the rule cannot tell you", r.watch]]) +
    '<div class="callout info" style="margin-top:14px">The engine detects <strong>unusual activity</strong>. It does not ' +
    'detect crime, and it has not formed a view. Whether this activity is suspicious is the question you are being asked ' +
    'to answer, on evidence.</div>');

  h += card("Alert record", '<div class="grid g2"><div>' + dl([
      ["Alert ID", c.alert.ref], ["Customer ID", c.customer.id], ["Customer", c.customer.name],
      ["Rule triggered", r.code + " " + r.name],
      ["Alert date", fmtDate(c.alert.date)], ["Review period", c.alert.period],
      ["Priority", priorityPill(c.alert.priority) + " · SLA " + PRIORITY[c.alert.priority].slaH + " hours", "html"],
      ["Risk rating", riskPill(c.alert.risk), "html"]
    ]) + '</div><div>' + dl([
      ["Transaction count", String(c.alert.count)],
      ["Alerted amount", money(c.alert.amount, c.ccy)], ["Currency", c.ccy],
      ["Product", c.alert.product], ["Channel", c.alert.channel],
      ["Countries involved", c.alert.countries.map(ctryName).join(", ")],
      ["Counterparties", String(c.alert.nCps)],
      ["Previous alert history", c.alert.prior]
    ]) + '</div></div>');

  h += card("Working questions",
    '<p class="tiny">A transaction monitoring investigation answers these before it reaches a decision. ' +
    'The answers belong in your notes and in the disposition.</p>' +
    '<div class="chipbar">' + ["Who?","What?","When?","Where?","Why?","How?","How much?","Who else is involved?",
      "Is this consistent with the customer's profile?","Is there a legitimate economic rationale?",
      "Can the explanation be independently supported?","What evidence contradicts the explanation?",
      "What further information is needed?"].map(q => '<span class="chip static">' + esc(q) + '</span>').join("") + '</div>');
  return h;

          (r.quote ? '<h4>Customer statement — recorded by the relationship manager</h4>' : "") +
          '<div style="white-space:pre-wrap">' + esc(a.resp) + '</div>' +
          '<div class="tiny" style="margin-top:8px;opacity:.75">Received ' + esc(a.at) + ' · ' + esc(T.label) + '</div></div>';
      }
      h += '</div>';
    });
    h += '</div></section>';
  });
  return h;
}

/* --- screening panels ----------------------------------------------------- */
function screeningPanel(c){
  const w = work(c.id), done = askedIds(w);
  let h = '';
  const sanc = SANC_KIND[c.sanctions.kind], med = MEDIA_KIND[c.media.kind];
  h += card("Sanctions screening",
    done.indexOf("sanc") < 0
      ? '<p class="tiny">Names have not been referred for screening. Screening is a required step wherever a counterparty, ' +
        'beneficiary or jurisdiction is in scope.</p><button class="btn primary" data-act="ask" data-id="sanc">Refer names to the Sanctions Team</button>'
      : '<div class="row" style="margin-bottom:10px">' + pill(sanc.label, sanc.tone) + '</div>' +
        '<p>' + esc(sanc.body) + '</p>' +
        (c.sanctions.items||[]).map(i => '<div class="callout" style="margin-top:10px"><strong>' + esc(i.head) + '</strong><br>' +
          '<span class="tiny">' + esc(i.src) + ' · ' + esc(fmtDate(i.date)) + '</span><br>' + esc(i.body) + '</div>').join("") +
        '<div class="callout ' + (c.sanctions.kind === "potential" ? "warn" : "") + '" style="margin-top:12px">' +
        'A <strong>potential</strong> match is not a confirmed match. The Sanctions Team owns the determination. ' +
        'Recording a potential match as confirmed is a reportable quality failure.</div>');

  h += card("Adverse media and open-source research",
    done.indexOf("media") < 0
      ? '<p class="tiny">No open-source research has been carried out.</p>' +
        '<button class="btn primary" data-act="ask" data-id="media">Run adverse media research</button>'
      : '<div class="row" style="margin-bottom:10px">' + pill(med.label, med.tone) + '</div>' +
        '<p>' + esc(med.body) + '</p>' +
        (c.media.items||[]).map(i => '<div class="paper" style="margin-top:12px"><h4>' + esc(i.src) + ' · ' + esc(fmtDate(i.date)) + '</h4>' +
          '<div style="font-weight:600;margin-bottom:6px">' + esc(i.head) + '</div>' + esc(i.body) + '</div>').join("") +
        '<div class="callout info" style="margin-top:12px">Distinguish <strong>information requiring investigation</strong> from ' +
        '<strong>confirmed evidence</strong>. Reporting is not a finding. An investigation is not a conviction. ' +
        'Say in your disposition which you are relying on.</div>');
  return h;
}

/* --- evidence / documents ------------------------------------------------ */
function viewEvidence(){
  const c = getCase(S.active); if (!c) return needCase();
  const w = work(c.id); w.viewed.add("docs"); markSeen(c, "Evidence and documents reviewed", "docs");
  const done = askedIds(w);
  let h = caseStrip(c);
  h += '<p class="page-lead">Source of funds asks where the money in these particular transactions came from. Source of ' +
    'wealth asks how the customer accumulated their overall wealth. They are different questions and a document that answers ' +
    'one rarely answers the other.</p>';
  if (done.indexOf("sofsow") < 0 && done.indexOf("proof") < 0){
    h += card("", empty("❐","No documents have been obtained",
      "Request source of funds and source of wealth evidence from the case file. Documents are disclosed only when you ask for them.",
      '<button class="btn primary" data-act="ask" data-id="sofsow">Request source of funds / wealth evidence</button>'));
    return h;
  }
  const docs = caseDocs(c);
  h += '<div class="grid g2">' + docs.map(d =>
    '<div class="card"><div class="card-h"><h3>' + esc(d.title) + '</h3>' +
      (d.consistent ? pill("Consistent","green") : pill("Inconsistency identified","orange")) + '</div>' +
    '<div class="card-b"><div class="paper"><span class="stamp">EVIDENCE</span><h4>' + esc(d.type) + '</h4>' +
      '<div class="meta">Obtained ' + esc(nowClock()) + ' · case ' + esc(c.alert.ref) + '</div>' +
      esc(d.body) + '</div>' +
    '<p class="tiny" style="margin-top:10px"><strong>Assessment:</strong> ' + esc(d.note) + '</p></div></div>').join("") + '</div>';
  h += '<div class="callout warn" style="margin-top:16px">A document that is internally consistent is not the same as a ' +
    'document that is independently verifiable. Ask what could corroborate it from a source the customer does not control.</div>';
  return h;
}

/* --- notes (§17) ---------------------------------------------------------- */
const NOTE_KINDS = [["observation","Observation"],["analysis","Analysis"],["evidence","Evidence"],["redflag","Red flag"],
  ["hypothesis","Hypothesis"],["request","Information requested"],["explanation","Customer explanation"],
  ["assessment","Assessment"],["decision","Decision"]];
function viewNotes(){
  const c = getCase(S.active); if (!c) return needCase();
  const w = work(c.id);
  let h = caseStrip(c);
  h += '<div class="grid g-side"><div class="stack">' +
    card("Add an investigation note",
      '<label class="field"><span class="lbl">Note type</span><select class="inp" id="noteKind">' +
      NOTE_KINDS.map(k => '<option value="' + k[0] + '">' + k[1] + '</option>').join("") + '</select></label>' +
      '<label class="field"><span class="lbl">Note</span><textarea class="inp" id="noteBody" rows="4" ' +
      'placeholder="State what you observed, what it means, and what supports it. Write so that someone who has never seen the account can follow it."></textarea></label>' +
      '<button class="btn primary" data-act="addnote">Save note</button>');

  if (w.notes.length){
    h += cardFlush("Investigation notes (" + w.notes.length + ")",
      w.notes.map((n,i) => '<div style="padding:12px 16px;border-bottom:1px solid var(--separator)">' +
        '<div class="row" style="margin-bottom:6px">' + pill((NOTE_KINDS.find(k=>k[0]===n.kind)||["","Note"])[1],
          n.kind === "redflag" ? "red" : n.kind === "evidence" ? "green" : n.kind === "explanation" ? "brown" :
          n.kind === "decision" ? "purple" : "blue") +
        '<span class="tiny">' + esc(n.at) + '</span><span class="tb-grow"></span>' +
        '<button class="btn sm ghost" data-act="editnote" data-id="' + i + '">Edit</button>' +
        '<button class="btn sm ghost" data-act="delnote" data-id="' + i + '">Delete</button></div>' +
        '<div style="white-space:pre-wrap">' + esc(n.body) + '</div></div>').join(""));
  } else {
    h += card("", empty("✎","No notes recorded yet",
      "Professional documentation is contemporaneous. Record observations as you make them, not at the end."));
  }
  h += '</div><div class="stack">' +
    card("Case timeline", w.timeline.length
      ? '<ul class="timeline">' + w.timeline.slice().reverse().map(t =>
          '<li class="' + esc(t.k||"") + '"><span class="tm">' + esc(t.t) + '</span><span class="dt"></span>' +
          '<span class="tx">' + esc(t.x) + '</span></li>').join("") + '</ul>'
      : '<p class="tiny">Actions appear here as you take them.</p>') +
    card("Documentation standard",
      '<p class="tiny">Separate what you <em>observed</em> from what you <em>infer</em>. Attribute every fact to where it came ' +
      'from. Where the customer has given an explanation, record it in their words and then record what tests it. ' +
      'Avoid absolute language: you are recording suspicion for the MLRO to consider, not making a finding of guilt.</p>');
  h += '</div></div>';
  return h;
}

/* --------------------------------------------------------------------------
   23. Case management shell — tabs across the case file
   -------------------------------------------------------------------------- */
const CASE_TABS = [["overview","Alert overview"],["investigate","Investigation actions"],["screening","Screening"],
  ["timeline","Timeline"],["decide","Decision & disposition"]];

function viewCases(){
  const c = getCase(S.active); if (!c) return needCase();
  const w = work(c.id);
  const tab = CASE_TABS.some(t => t[0] === S.tab) ? S.tab : "overview";
  let h = caseStrip(c);
  h += '<div class="card" style="margin-bottom:16px"><div class="tabs" role="tablist">' +
    CASE_TABS.map(t => '<button role="tab" data-act="tab" data-id="' + t[0] + '" aria-selected="' + (tab===t[0]) + '">' +
      t[1] + '</button>').join("") + '</div></div>';

  if (tab === "overview") h += alertOverview(c);
  else if (tab === "investigate") h += investigationPanel(c);
  else if (tab === "screening") h += screeningPanel(c);
  else if (tab === "timeline") h += timelineTab(c, w);
  else h += decisionTab(c, w);
  return h;
}

function timelineTab(c, w){
  return '<div class="grid g-side"><div>' +
    card("Case audit trail", w.timeline.length
      ? '<ul class="timeline">' + w.timeline.map(t =>
        '<li class="' + esc(t.k||"") + '"><span class="tm">' + esc(t.t) + '</span><span class="dt"></span>' +
        '<span class="tx">' + esc(t.x) + '</span></li>').join("") + '</ul>'
      : '<p class="tiny">No actions recorded yet.</p>') +
    '</div><div class="stack">' +
    card("Why this matters",
      '<p class="tiny">Every analyst action is recorded with a timestamp. The trail evidences what was reviewed and when, ' +
      'which is what a regulator, an auditor or a court would examine if the case were ever revisited. It is also what ' +
      'protects the analyst: a decision that looks wrong later is defensible if the record shows it was reasonable on what ' +
      'was known at the time.</p>') +
    card("Progress", dl([
      ["Status", (STATUS[w.status]||STATUS.new).label],
      ["Assigned", new Date(w.assignedAt).toLocaleString("en-GB", {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})],
      ["SLA", slaState(w).label],
      ["Actions taken", String((w.asked||[]).length)],
      ["Transactions flagged", String(w.flags.size)],
      ["Notes recorded", String(w.notes.length)],
      ["Hints used", String(w.hints) + " of 3"]])) +
    '</div></div>';
}

/* --------------------------------------------------------------------------
   24. Decision and disposition  (§19, §20)
   -------------------------------------------------------------------------- */
const DECISIONS = [
  { id:"close", label:"Close — activity reasonably explained", tone:"green",
    body:"The activity is unusual against the profile but is explained, and the explanation is supported by evidence you have tested. Closing does not mean nothing happened; it means there is no reasonable ground for suspicion." },
  { id:"edd", label:"Request information / enhanced due diligence", tone:"orange",
    body:"Material concerns remain unresolved and the outstanding information is identifiable and obtainable. Use this where the evidence supports neither closure nor escalation." },
  { id:"escalate", label:"Escalate to the MLRO", tone:"red",
    body:"Reasonable grounds for knowledge or suspicion remain after investigation. Escalation refers the matter to the MLRO for a decision on external reporting." }
];
function decisionTab(c, w){
  const role = ROLES[PROG.role];
  const done = PROG.completed[c.id];
  let h = '';
  if (done) return completedPanel(c, w, done);

  h += card("Decision",
    '<p class="page-lead">You are not determining whether an offence has been committed. You are deciding whether, on the ' +
    'evidence you have gathered, there are reasonable grounds to suspect — and documenting that decision so it can be reviewed.</p>' +
    '<div class="stack">' + DECISIONS.map(d => {
      const blocked = (d.id === "edd" && !role.can.edd);
      return '<button class="chip" data-act="decide" data-id="' + d.id + '" aria-pressed="' + (w.decision===d.id) + '"' +
        (blocked ? " disabled" : "") + ' style="display:block;text-align:left;border-radius:12px;padding:13px;height:auto">' +
        '<div class="row" style="margin-bottom:5px">' + pill(d.label, d.tone) +
        (blocked ? ' <span class="tiny">not permitted for your role</span>' : "") + '</div>' +
        '<div style="font-size:var(--t-foot);opacity:.85;line-height:1.55">' + esc(d.body) + '</div></button>'; }).join("") +
    '</div>' +
    (w.decision === "escalate" && role.can.recommendSar
      ? '<label class="switch" style="margin-top:14px"><input type="checkbox" id="sarRec"' + (w.sarRecommended?" checked":"") + '>' +
        '<span class="track"></span><span>Also recommend that the MLRO consider a SAR/STR</span></label>' +
        '<div class="callout info" style="margin-top:10px">A recommendation is not a report. The MLRO decides whether to ' +
        'report, and the institution — not the analyst — makes any external disclosure. Do not tip off the customer.</div>'
      : "") );

  h += card("Professional case disposition",
    '<p class="page-lead">Write the disposition as the permanent record of the investigation. Cover the alert trigger, the ' +
    'customer profile, the relevant transactions, the indicators identified, what you did, what the customer said, the ' +
    'evidence supporting and contradicting that account, your risk assessment, the potential typology and your decision.</p>' +
    '<div class="chipbar" style="margin-bottom:12px">' +
      ["Alert trigger","Customer profile","Relevant transactions","Key indicators","Investigation performed",
       "Customer explanation","Supporting evidence","Contradictory evidence","Risk assessment","Potential typology","Decision"]
      .map(x => '<span class="chip static">' + esc(x) + '</span>').join("") + '</div>' +
    '<textarea class="inp" id="dispo" rows="16" placeholder="Begin with what the rule measured and what the numbers actually are…">' +
      esc(w.disposition) + '</textarea>' +
    '<div class="row tiny" style="margin-top:8px"><span id="wc">' +
      (w.disposition.trim() ? w.disposition.trim().split(/\s+/).length : 0) + ' words</span>' +
      '<span class="tb-grow"></span><span class="dim">Assessed for accuracy, objectivity, clarity, evidence-led reasoning, ' +
      'terminology, completeness and unsupported assumptions.</span></div>' +
    '<div class="btn-row" style="margin-top:14px">' +
      '<button class="btn primary lg" data-act="submit"' + (w.decision ? "" : " disabled") + '>Submit for QA review</button>' +
      '<button class="btn" data-act="savedisp">Save draft</button>' +
      '<button class="btn ghost" data-act="hint">Request a hint (' + (3 - w.hints) + ' left)</button></div>' +
    (w.hints ? '<div class="callout warn" style="margin-top:12px"><strong>Hints used: ' + w.hints + '.</strong> ' +
      (c.hints||[]).slice(0, w.hints).map(x => '<div style="margin-top:6px">' + esc(x) + '</div>').join("") + '</div>' : ""));

  const missing = [];
  if (!w.flags.size) missing.push("no transactions have been flagged as relevant");
  if (!(w.asked||[]).length) missing.push("no investigation actions have been taken");
  if (askedIds(w).indexOf("sanc") < 0) missing.push("sanctions screening has not been run");
  if (askedIds(w).indexOf("media") < 0) missing.push("adverse media research has not been run");
  if (!w.notes.length) missing.push("no investigation notes have been recorded");
  if (missing.length) h += '<div class="callout warn">Before you submit — ' + esc(missing.join("; ")) +
    '. You may submit anyway; QA reviews what you did, not what you intended.</div>';
  return h;
}

/* --------------------------------------------------------------------------
   25. Submission, QA result and training report  (§25, §33)
   -------------------------------------------------------------------------- */
function submitCase(){
  const c = getCase(S.active), w = work(c.id);
  if (!w.decision) return toast("Select a decision first.");
  const disp = $("#dispo");
  if (disp) w.disposition = disp.value;
  const ev = evaluateCase(c, w);
  const minutes = Math.max(1, Math.round((Date.now() - (w.startedAt || w.assignedAt)) / 60000));
  const breached = Date.now() > w.dueAt;
  w.qa = { ev, narrative: qaNarrative(c, ev, w) };
  w.submittedAt = Date.now();
  w.status = w.decision === "escalate" ? "escalated" : w.decision === "edd" ? "pending" : "closed";
  logIt(c.id, "Decision recorded: " + OUTCOME_NAME[w.decision], "d");
  logIt(c.id, "Disposition submitted for QA review", "d");
  PROG.completed[c.id] = {
    id:c.id, ref:c.alert.ref, title:c.title, customer:c.customer.name, level:c.level, kind:c.kind,
    inst:c.inst, rule:c.alert.ruleId, decision:w.decision, outcome:c.outcome, score:ev.score, verdict:ev.verdict,
    dims:ev.dims.map(d => ({k:d.k,v:Math.round(d.v)})), missedFlags:ev.missed.map(f=>f.k),
    foundFlags:ev.found.map(f=>f.k), typology:c.typology, typologyHit:ev.typHit,
    unnecessary:ev.unnecessary, requests:(w.asked||[]).length, minutes, breached,
    hints:w.hints, when:Date.now(), qaSeen:false, learn:ev.learn, sar:w.sarRecommended
  };
  PROG.seenTypologies = uniq(PROG.seenTypologies.concat(c.typology));
  PROG.queue = (PROG.queue||[]).filter(id => id !== c.id);
  saveProg();
  S.tab = "decide"; S.nav = "cases";
  render();
  window.scrollTo({ top:0, behavior:"smooth" });
}

function completedPanel(c, w, rec){
  const ev = w.qa ? w.qa.ev : null;
  rec.qaSeen = true; saveProg();
  let h = '';
  const tone = rec.verdict === "Pass" ? "green" : rec.verdict === "Borderline" ? "orange" : "red";
  h += '<div class="grid g4" style="margin-bottom:16px">' +
    tile("QA score", rec.score + " / 100", "Senior AML QA review", tone === "green" ? "green" : tone === "orange" ? "orange" : "red") +
    tile("Result", rec.verdict, "pass threshold 75") +
    tile("Your decision", (OUTCOME_NAME[rec.decision]||"").split(" —")[0], rec.decision === rec.outcome ? "matches the supported outcome" : "differs from the supported outcome",
      rec.decision === rec.outcome ? "green" : "red") +
    tile("Handling time", rec.minutes + " min", rec.breached ? "SLA breached" : "within SLA", rec.breached ? "red" : "green") +
    '</div>';

  if (ev) h += card("QA scorecard",
    ev.dims.map(d => '<div class="scorebar"><span>' + esc(d.label) + ' <span class="dim2">(' + d.wgt + '%)</span></span>' +
      '<span class="bar"><i style="width:' + Math.round(d.v) + '%;background:var(--' +
      (d.v >= 75 ? "green" : d.v >= 55 ? "orange" : "red") + ')"></i></span>' +
      '<span class="right num">' + Math.round(d.v) + '</span></div>').join(""));

  if (w.qa) h += card("Senior AML QA reviewer — written review",
    '<div style="white-space:pre-wrap;line-height:1.7">' + esc(w.qa.narrative) + '</div>');

  if (ev){
    h += '<div class="grid g2">';
    h += card("Indicators you identified (" + ev.found.length + ")", ev.found.length
      ? '<ul style="margin:0;padding-left:18px">' + ev.found.map(f => '<li style="margin-bottom:5px">' + esc(f.t) + '</li>').join("") + '</ul>'
      : '<p class="tiny">None of the indicators present were articulated in your notes or disposition.</p>');
    h += card("Indicators missed (" + ev.missed.length + ")", ev.missed.length
      ? '<ul style="margin:0;padding-left:18px">' + ev.missed.map(f => '<li style="margin-bottom:5px">' + esc(f.t) + '</li>').join("") + '</ul>'
      : '<p class="tiny">You addressed every indicator present in this case.</p>');
    h += '</div>';
    if (c.traps && c.traps.length) h += card("Points that should have been discounted",
      '<ul style="margin:0;padding-left:18px">' + c.traps.map(t => '<li style="margin-bottom:5px">' + esc(t.t) + '</li>').join("") + '</ul>');
  }

  /* the reveal — only after submission */
  h += card("Case reveal",
    '<div class="row" style="margin-bottom:12px">' + kindPill(c.kind) + levelPill(c.level) +
      pill("Supported outcome: " + (OUTCOME_NAME[c.outcome]||"").split(" —")[0], c.outcome === "escalate" ? "red" : c.outcome === "edd" ? "orange" : "green") + '</div>' +
    '<h4 class="eyebrow" style="margin-bottom:6px">What this case was</h4><p>' + esc(c.reveal.what || "") + '</p>' +
    '<h4 class="eyebrow" style="margin:16px 0 6px">Potential typology</h4>' +
    '<div class="chipbar">' + c.typology.map(t => '<span class="chip static">' + esc(t) + '</span>').join("") + '</div>' +
    (c.reveal.facts ? '<h4 class="eyebrow" style="margin:16px 0 6px">Documented basis and what was invented</h4>' +
      '<div class="callout info">' + esc(c.reveal.facts) + '</div>' : "") +
    ((c.reveal.sources||[]).length ? '<h4 class="eyebrow" style="margin:16px 0 6px">Sources</h4><ul style="margin:0;padding-left:18px">' +
      c.reveal.sources.map(s => '<li><a href="' + esc(s.u) + '" target="_blank" rel="noopener">' + esc(s.l) + '</a></li>').join("") + '</ul>' : ""));

  h += '<div class="grid g2">' +
    card("Model disposition", '<div class="paper" style="white-space:pre-wrap">' + esc(c.model || "") + '</div>') +
    card("Your disposition", '<div class="paper" style="white-space:pre-wrap">' + esc(w.disposition || "— no disposition was written —") + '</div>') +
    '</div>';

  h += card("Training report",
    dl([["Investigation score", rec.score + " / 100 (" + rec.verdict + ")"],
        ["Decision recorded", OUTCOME_NAME[rec.decision] || "—"],
        ["Risk-based outcome supported by the evidence", OUTCOME_NAME[rec.outcome]],
        ["Red flags identified", String(rec.foundFlags.length)],
        ["Red flags missed", String(rec.missedFlags.length)],
        ["Information requests made", String(rec.requests)],
        ["Requests that did not bear on the outcome", String(rec.unnecessary)],
        ["Potential typology", rec.typology.join("; ")],
        ["Typology identified", rec.typologyHit ? "Yes" : "No"],
        ["Hints used", String(rec.hints)],
        ["Handling time", rec.minutes + " minutes" + (rec.breached ? " — SLA breached" : " — within SLA")],
        ["Recommended learning area", rec.learn]]) +
    '<div class="btn-row" style="margin-top:16px">' +
    '<button class="btn primary" data-act="nextcase">Take the next alert</button>' +
    '<button class="btn" data-act="nav" data-id="performance">Performance profile</button>' +
    '<button class="btn ghost" data-act="nav" data-id="queue">Back to the queue</button></div>');
  return h;
}

/* --------------------------------------------------------------------------
   26. Escalations  (§19, §27)
   -------------------------------------------------------------------------- */
function viewEscalations(){
  const esc_ = completedList().filter(r => r.decision === "escalate");
  const edd = completedList().filter(r => r.decision === "edd");
  const role = ROLES[PROG.role];
  let h = '<p class="page-lead">Escalation refers a matter to the MLRO. The analyst records suspicion and the basis for it; ' +
    'the MLRO decides whether the institution makes an external report. Nothing on this screen is a determination that an ' +
    'offence has been committed, and nothing here may be disclosed to the customer.</p>';

  h += '<div class="grid g4" style="margin-bottom:16px">' +
    tile("Escalated to MLRO", esc_.length, "awaiting MLRO consideration", esc_.length ? "red" : "") +
    tile("SAR/STR recommended", esc_.filter(r => r.sar).length, "analyst recommendation only") +
    tile("In enhanced due diligence", edd.length, "information outstanding", edd.length ? "orange" : "") +
    tile("Escalation accuracy", esc_.length ? Math.round(esc_.filter(r=>r.outcome==="escalate").length/esc_.length*100) + "%" : "—",
      "escalations the evidence supported") + '</div>';

  if (!esc_.length && !edd.length)
    return h + card("", empty("↑","No escalations yet","Cases you escalate or place into enhanced due diligence appear here with their MLRO status."));

  if (esc_.length) h += cardFlush("Escalations to the MLRO",
    '<div class="tw"><table class="tbl"><thead><tr><th>Alert</th><th>Customer</th><th>Typology recorded</th>' +
    '<th>SAR/STR recommended</th><th>MLRO position</th><th class="num">QA</th></tr></thead><tbody>' +
    esc_.map(r => '<tr class="clickable" data-act="open" data-id="' + r.id + '">' +
      '<td class="mono">' + esc(r.ref) + '</td><td>' + esc(r.customer) + '</td>' +
      '<td class="dim">' + esc((r.typology||[]).slice(0,2).join("; ")) + '</td>' +
      '<td>' + (r.sar ? pill("Recommended","red") : pill("Not recommended","")) + '</td>' +
      '<td>' + (r.outcome === "escalate"
        ? pill("Accepted — proceeding to MLRO assessment","green")
        : r.outcome === "edd" ? pill("Returned — information outstanding","orange")
        : pill("Returned — activity explained","red")) + '</td>' +
      '<td class="num">' + r.score + '</td></tr>').join("") + '</tbody></table></div>');

  if (edd.length) h += cardFlush("Enhanced due diligence — information outstanding",

  const pass = done.filter(d => d.verdict === "Pass").length;

      done.filter(d => d.decision !== d.outcome).length ? "red" : "green") + '</div>';

  /* dimension averages across all reviews */
  const dimAvg = {};
  done.forEach(d => (d.dims||[]).forEach(x => { (dimAvg[x.k] = dimAvg[x.k] || []).push(x.v); }));

/* --- actions -------------------------------------------------------------- */
function doAsk(id){
  const c = getCase(S.active), w = work(c.id);
  if (askedIds(w).indexOf(id) >= 0) return;
  const r = c.requests.find(x => x.id === id); if (!r) return;
  const T = TEAMS[r.to] || TEAMS.ops;
  if (r.to === "customer" && !ROLES[PROG.role].can.requestCustomer) return toast("Your role cannot contact the customer directly.");
  let resp = r.resp;
  if (r.kind === "sanctions") resp = SANC_KIND[c.sanctions.kind].body;
  if (r.kind === "media") resp = MEDIA_KIND[c.media.kind].body;
  if (r.kind === "docs" && !resp) resp = "Documents obtained. See Evidence & Documents.";
  w.asked.push({ id:id, at:nowClock(), resp:resp || "No response was received within the period allowed." });
  if (r.to === "customer" && w.status === "investigating") w.status = "pending";
  logIt(c.id, "Requested: " + r.label + " (" + T.label + ")");
  if (r.kind === "sanctions") logIt(c.id, "Sanctions screening result: " + SANC_KIND[c.sanctions.kind].label);
  if (r.kind === "media") logIt(c.id, "Adverse media result: " + MEDIA_KIND[c.media.kind].label);
  saveProg(); render(); toast("Response received from " + T.label);
}
function addNote(kind, body, idx){
  const c = getCase(S.active), w = work(c.id);
  if (!body.trim()) return toast("Write the note first.");
  if (idx != null && w.notes[idx]){ w.notes[idx].body = body; w.notes[idx].kind = kind; logIt(c.id, "Investigation note updated"); }
  else { w.notes.push({ kind, body, at: nowClock() }); logIt(c.id, "Note recorded: " + (NOTE_KINDS.find(k=>k[0]===kind)||["","Note"])[1]); }
  saveProg(); render(); toast("Note saved");
}

  const act = el.getAttribute("data-act"), id = el.getAttribute("data-id");

  switch(act){
    case "pick-inst": PROG.inst = id; PROG.queue = []; saveProg(); render(); break;
    case "pick-role": PROG.role = id; saveProg(); render(); break;
    case "start": {

      PROG.onboarded = true; PROG.queue = []; PROG.sessionStart = Date.now();
      S.screen = "app"; S.nav = "dashboard"; saveProg(); render();
      toast("Signed in to " + inst(PROG.inst).name); break; }
    case "resume": S.screen = "app"; S.nav = PROG.lastNav || "dashboard"; saveProg(); render(); break;
    case "nav": {
      const item = NAV.flatMap(g => g.items).find(x => x.id === id);
      if (item && item.needsCase && !S.active){ S.nav = "queue"; toast("Open an alert first."); }
      else S.nav = id;
      S.sideOpen = false; S.entityView = null;
      if (["cases","customer"].indexOf(id) >= 0) S.tab = id === "cases" ? "overview" : "profile";
      render(); window.scrollTo({top:0}); break; }
    case "side": S.sideOpen = !S.sideOpen; render(); break;
    case "tab": S.tab = id; render(); break;
    case "sort": if (S.sort.key === id) S.sort.asc = !S.sort.asc; else { S.sort.key = id; S.sort.asc = true; } render(); break;
    case "tsort": if (S.txnF.sort === id) S.txnF.asc = !S.txnF.asc; else { S.txnF.sort = id; S.txnF.asc = true; } render(); break;
    case "clearf": S.filters = { q:"", risk:"", priority:"", status:"", rule:"", level:"", sla:"", country:"" }; render(); break;
    case "cleartf": S.txnF = Object.assign(S.txnF, { q:"", dir:"", cc:"", method:"", channel:"", cp:"", min:"", max:"", from:"", to:"", group:"" }); render(); break;
    case "open": closeModal(); openCase(id); break;
    case "switchcase": switchCaseModal(); break;
    case "nextcase": nextCase(); break;
    case "flagtxn": {
      if (!c) break; const w = work(c.id), n = Number(id);
      if (w.flags.has(n)){ w.flags.delete(n); logIt(c.id, "Flag removed from transaction " + n); }
      else { w.flags.add(n); logIt(c.id, "Transaction " + n + " flagged as relevant"); }
      saveProg(); closeModal(); render(); break; }
    case "txndetail": if (c) txnDetailModal(c, Number(id)); break;
    case "cp-from-txn": {
      if (!c) break; const i = c.counterparties.findIndex(x => x.name === id);
      closeModal(); if (i >= 0){ S.nav = "entity"; S.entityView = i; render(); } break; }
    case "entity": S.nav = "entity"; S.entityView = id; render(); window.scrollTo({top:0}); break;
    case "entity-back": S.entityView = null; render(); break;
    case "gnode": {
      if (!c) break;
      const n = c.graph.nodes.find(x => x.id === id);
      if (n && n.cpIndex != null){ S.entityView = n.cpIndex; render(); window.scrollTo({top:0}); }
      else if (n && n.id === "CUST"){ S.nav = "customer"; S.tab = "profile"; render(); }
      break; }
    case "ungroup": S.txnF.group = ""; S.txnF.q = id; render(); break;
    case "notefor": S.nav = "notes"; render(); setTimeout(() => { const b = $("#noteBody"); if (b){ b.value = "Entity: " + id + " — "; b.focus(); } }, 30); break;
    case "ask": doAsk(id); break;
    case "decide": {
      if (!c) break; const w = work(c.id);
      w.decision = w.decision === id ? null : id;
      if (w.decision) logIt(c.id, "Provisional decision: " + OUTCOME_NAME[w.decision]);
      saveProg(); render(); break; }
    case "savedisp": {
      if (!c) break; const w = work(c.id), d = $("#dispo");
      if (d){ w.disposition = d.value; saveProg(); toast("Draft saved"); }
      break; }
    case "submit": {
      const d = $("#dispo"); if (d && c) work(c.id).disposition = d.value;
      const sar = $("#sarRec"); if (sar && c) work(c.id).sarRecommended = sar.checked;
      submitCase(); break; }
    case "hint": {
      if (!c) break; const w = work(c.id);
      if (w.hints >= 3) return toast("No hints remain on this case.");
      w.hints++; logIt(c.id, "Hint requested (" + w.hints + " of 3)");
      saveProg(); render(); break; }
    case "addnote": {
      const k = $("#noteKind"), b = $("#noteBody");
      if (k && b){ addNote(k.value, b.value); } break; }
    case "editnote": {
      if (!c) break; const w = work(c.id), n = w.notes[Number(id)];
      if (!n) break;
      openModal('<div class="modal-h"><h3>Edit note</h3><button class="btn sm ghost" data-act="close-modal" aria-label="Close">✕</button></div>' +
        '<div class="modal-b"><label class="field"><span class="lbl">Note type</span><select class="inp" id="editKind">' +
        NOTE_KINDS.map(x => '<option value="' + x[0] + '"' + (n.kind===x[0]?" selected":"") + '>' + x[1] + '</option>').join("") +
        '</select></label><label class="field"><span class="lbl">Note</span><textarea class="inp" id="editBody" rows="6">' + esc(n.body) + '</textarea></label>' +
        '<div class="btn-row"><button class="btn primary" data-act="saveedit" data-id="' + id + '">Save</button>' +
        '<button class="btn ghost" data-act="close-modal">Cancel</button></div></div>');
      break; }
    case "saveedit": {
      const k = $("#editKind"), b = $("#editBody");
      if (k && b){ closeModal(); addNote(k.value, b.value, Number(id)); } break; }
    case "delnote": {
      if (!c) break; const w = work(c.id);
      w.notes.splice(Number(id), 1); logIt(c.id, "Investigation note deleted"); saveProg(); render(); break; }
    case "gen": {
      const lv = $("#genLevel"), pt = $("#genPattern"), it = $("#genInst");
      const newId = generateCase({ level: lv && lv.value ? Number(lv.value) : null,
        pattern: pt && pt.value ? pt.value : null, inst: it ? it.value : PROG.inst });
      openCase(newId); toast("Practice case generated"); break; }
    case "settings": settingsModal(); break;
    case "savesettings": {
      const n = $("#setName"), r = $("#setRole"), i = $("#setInst"), t = $("#setTheme"), s = $("#setScale");
      if (n) PROG.analyst = n.value.trim() || "Analyst";
      if (r) PROG.role = r.value;
      if (t) PROG.theme = t.value;
      if (s) PROG.textScale = Number(s.value);
      if (i && i.value !== PROG.inst){ PROG.inst = i.value; PROG.queue = []; S.active = null; }
      closeModal(); saveProg(); render(); toast("Settings saved"); break; }
    case "theme": {
      PROG.theme = PROG.theme === "dark" ? "light" : PROG.theme === "light" ? "" : "dark";
      saveProg(); render();
      toast("Appearance: " + (PROG.theme || "match the system")); break; }
    case "reset": if (confirm("Reset all progress, completed cases and performance history? This cannot be undone.")){
        resetProg(); S.screen = "login"; S.active = null; closeModal(); render(); } break;
    case "close-modal": closeModal(); break;
    case "modal-bg": if (e.target === el) closeModal(); break;
  }
});

/* filter inputs */
document.addEventListener("input", function(e){
  const t = e.target;
  if (t.hasAttribute && t.hasAttribute("data-f")){ S.filters[t.getAttribute("data-f")] = t.value; debounceRender(); }
  else if (t.hasAttribute && t.hasAttribute("data-tf")){ S.txnF[t.getAttribute("data-tf")] = t.value; debounceRender(); }
  else if (t.id === "dispo"){ const wc = $("#wc"); if (wc) wc.textContent = (t.value.trim() ? t.value.trim().split(/\s+/).length : 0) + " words"; }
  else if (t.id === "setScale"){ document.documentElement.style.setProperty("--ts", t.value);
    const lbl = t.closest(".field"); if (lbl) lbl.querySelector(".lbl").textContent = "Text size — " + Math.round(t.value*100) + "%"; }
});
document.addEventListener("change", function(e){
  const t = e.target;
  if (t.hasAttribute && (t.hasAttribute("data-f") || t.hasAttribute("data-tf"))){
    if (t.hasAttribute("data-f")) S.filters[t.getAttribute("data-f")] = t.value;
    else S.txnF[t.getAttribute("data-tf")] = t.value;
    render();
  }
});
let _rt = null;
function debounceRender(){
  clearTimeout(_rt);
  _rt = setTimeout(() => {
    const a = document.activeElement;
    const key = a && (a.getAttribute("data-f") || a.getAttribute("data-tf"));
    const pos = a && a.selectionStart;
    render();
    if (key){
      const next = document.querySelector('[data-f="' + key + '"],[data-tf="' + key + '"]');
      if (next){ next.focus(); try { next.setSelectionRange(pos, pos); } catch(err){} }
    }
  }, 220);
}
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && S.modal) closeModal();
  if (e.key === "Enter" && (e.target.id === "analystName")) { const b = document.querySelector('[data-act="start"]'); if (b) b.click(); }
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("gnode")) e.target.click();
});
document.addEventListener("keyup", function(e){
  if (e.key === "Enter" || e.key === " "){
    const g = e.target.closest && e.target.closest(".gnode");
    if (g){ e.preventDefault(); g.click(); }
  }
});

/* --- boot ----------------------------------------------------------------- */
function boot(){
  registerCases();
  loadProg();
  applyAppearance();
  S.screen = PROG.onboarded ? "app" : "login";
  S.nav = PROG.lastNav || "dashboard";
  /* rehydrate any generated cases that no longer exist after a reload */
  Object.keys(PROG.completed).forEach(id => {
    if (!CASE_INDEX.some(x => x.id === id)){
      const r = PROG.completed[id];
      CASE_INDEX.push({ id, kind:r.kind, level:r.level, inst:r.inst, title:r.title, rule:r.rule,
        outcome:r.outcome, priority:"medium", src:"generated" });
    }
  });
  PROG.queue = (PROG.queue||[]).filter(id => CASE_INDEX.some(x => x.id === id) && !PROG.completed[id]);
  if (S.screen === "app") buildQueue();
  render();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
