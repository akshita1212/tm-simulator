<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sentinel TM — Transaction Monitoring &amp; AML Investigation Simulator</title>
<meta name="description" content="A training simulation of a financial institution's transaction monitoring and AML investigations workspace.">
<style>
/* ==========================================================================
   SENTINEL TM — design system
   Semantic tokens adapted from Apple Human Interface Guidelines.
   Every colour is defined on :root first (light), then re-declared for the
   dark appearance and for the explicit theme override, so no colour has its
   only definition inside a media query.
   ========================================================================== */

:root{
  /* --- type scale ------------------------------------------------------ */
  --ts: 1;                                   /* Dynamic Type multiplier */
  --f-sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Roboto Mono", "Cascadia Mono", Consolas, monospace;
  --f-serif: ui-serif, "New York", Georgia, "Times New Roman", serif;

  --t-large:  1.5rem;    --lh-large: 1.2;    /* Large title  24 */
  --t-title:  1.25rem;   --lh-title: 1.25;   /* Title 2      20 */
  --t-title3: 1.0625rem; --lh-title3: 1.3;   /* Title 3      17 */
  --t-head:   0.875rem;  --lh-head: 1.35;    /* Headline     14 */
  --t-body:   0.8125rem; --lh-body: 1.55;    /* Body         13 */
  --t-callout:0.8125rem;
  --t-sub:    0.75rem;                       /* Subhead      12 */
  --t-foot:   0.6875rem;                     /* Footnote     11 */
  --t-cap:    0.625rem;                      /* Caption      10 - labels only */

  /* --- spacing (4pt grid) ---------------------------------------------- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;

  /* --- greys / surfaces (light) ---------------------------------------- */
  --bg:            #f2f2f7;   /* grouped background          */
  --surface:       #ffffff;   /* raised content              */
  --surface-2:     #f9f9fb;   /* subtle inset                */
  --surface-3:     #ececf1;   /* deeper inset / table head   */
  --chrome:        rgba(249,249,251,.78);  /* toolbar material */
  --sidebar:       rgba(242,242,247,.80);
  --overlay:       rgba(0,0,0,.28);

  --label:         #000000;
  --label-2:       rgba(60,60,67,.68);
  --label-3:       rgba(60,60,67,.46);
  --label-4:       rgba(60,60,67,.30);
  --separator:     rgba(60,60,67,.20);
  --separator-op:  #d6d6da;
  --fill:          rgba(120,120,128,.12);
  --fill-2:        rgba(120,120,128,.18);
  --fill-3:        rgba(120,120,128,.26);

  /* --- accents --------------------------------------------------------- */
  --blue:   #0062cc;  --blue-bg:   rgba(0,122,255,.12);
  --green:  #1c7a3e;  --green-bg:  rgba(52,199,89,.14);
  --orange: #a55a00;  --orange-bg: rgba(255,149,0,.16);
  --red:    #c8271c;  --red-bg:    rgba(255,59,48,.12);
  --purple: #7130a8;  --purple-bg: rgba(175,82,222,.12);
  --teal:   #0a6f83;  --teal-bg:   rgba(48,176,199,.14);
  --brown:  #6d5641;  --brown-bg:  rgba(162,132,94,.16);
  --tint:   var(--blue);
  --on-tint:#ffffff;

  --shadow-1: 0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.05);
  --shadow-2: 0 4px 16px rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.06);
  --shadow-3: 0 18px 48px rgba(0,0,0,.20), 0 0 0 .5px rgba(0,0,0,.10);

  --sidebar-w: 248px;
  --insp-w: 320px;
}

/* dark appearance: system preference, unless the user forced light */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --surface-2:#242426; --surface-3:#2c2c2e;
    --chrome: rgba(28,28,30,.76); --sidebar: rgba(24,24,26,.80); --overlay: rgba(0,0,0,.55);
    --label:#ffffff; --label-2:rgba(235,235,245,.66); --label-3:rgba(235,235,245,.42);
    --label-4:rgba(235,235,245,.26);
    --separator:rgba(84,84,88,.62); --separator-op:#38383a;
    --fill:rgba(120,120,128,.20); --fill-2:rgba(120,120,128,.28); --fill-3:rgba(120,120,128,.36);
    --blue:#4aa3ff;  --blue-bg:rgba(10,132,255,.20);
    --green:#4ad46a; --green-bg:rgba(48,209,88,.18);
    --orange:#ffab30;--orange-bg:rgba(255,159,10,.20);
    --red:#ff6a60;   --red-bg:rgba(255,69,58,.20);
    --purple:#cf82f5;--purple-bg:rgba(191,90,242,.20);
    --teal:#54cde4;  --teal-bg:rgba(64,200,224,.18);
    --brown:#c0a184; --brown-bg:rgba(172,142,104,.20);
    --on-tint:#ffffff;
    --shadow-1: 0 1px 2px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.07);
    --shadow-2: 0 4px 16px rgba(0,0,0,.55), 0 0 0 .5px rgba(255,255,255,.08);
    --shadow-3: 0 18px 48px rgba(0,0,0,.7), 0 0 0 .5px rgba(255,255,255,.10);
  }
}
/* explicit dark override wins in both directions */
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#242426; --surface-3:#2c2c2e;
  --chrome: rgba(28,28,30,.76); --sidebar: rgba(24,24,26,.80); --overlay: rgba(0,0,0,.55);
  --label:#ffffff; --label-2:rgba(235,235,245,.66); --label-3:rgba(235,235,245,.42);
  --label-4:rgba(235,235,245,.26);
  --separator:rgba(84,84,88,.62); --separator-op:#38383a;
  --fill:rgba(120,120,128,.20); --fill-2:rgba(120,120,128,.28); --fill-3:rgba(120,120,128,.36);
  --blue:#4aa3ff;  --blue-bg:rgba(10,132,255,.20);
  --green:#4ad46a; --green-bg:rgba(48,209,88,.18);
  --orange:#ffab30;--orange-bg:rgba(255,159,10,.20);
  --red:#ff6a60;   --red-bg:rgba(255,69,58,.20);
  --purple:#cf82f5;--purple-bg:rgba(191,90,242,.20);
  --teal:#54cde4;  --teal-bg:rgba(64,200,224,.18);
  --brown:#c0a184; --brown-bg:rgba(172,142,104,.20);
  --on-tint:#ffffff;
  --shadow-1: 0 1px 2px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.07);
  --shadow-2: 0 4px 16px rgba(0,0,0,.55), 0 0 0 .5px rgba(255,255,255,.08);
  --shadow-3: 0 18px 48px rgba(0,0,0,.7), 0 0 0 .5px rgba(255,255,255,.10);
}
/* increased-contrast support */
@media (prefers-contrast: more){
  :root{ --label-2:rgba(60,60,67,.92); --label-3:rgba(60,60,67,.72); --separator:rgba(60,60,67,.5); }
  :root[data-theme="dark"], :root:not([data-theme="light"]){ --label-2:rgba(235,235,245,.92); --label-3:rgba(235,235,245,.75); }
}

/* ==========================================================================
   base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(16px * var(--ts)); -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--label);
  font-family:var(--f-sys); font-size:var(--t-body); line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
p{margin:0 0 var(--s3)}
p:last-child{margin-bottom:0}
a{color:var(--tint); text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit; color:inherit; font-variant-numeric:inherit}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px}
::selection{background:var(--blue-bg)}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--f-mono); font-size:.94em; letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--label-2)}
.dim2{color:var(--label-3)}
.tiny{font-size:var(--t-foot); color:var(--label-2)}
.eyebrow{font-size:var(--t-cap); font-weight:640; letter-spacing:.07em; text-transform:uppercase; color:var(--label-3)}
.nowrap{white-space:nowrap}
.right{text-align:right}
.center{text-align:center}
.wrap{overflow-wrap:anywhere}
hr.sep{border:0;border-top:1px solid var(--separator);margin:var(--s4) 0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ==========================================================================
   app shell
   ========================================================================== */
#app{min-height:100vh}
.shell{display:grid; grid-template-columns:var(--sidebar-w) minmax(0,1fr); min-height:100vh}
.shell.no-side{grid-template-columns:minmax(0,1fr)}

/* --- sidebar (translucent control layer over content) --------------------- */
.side{
  position:sticky; top:0; height:100vh; overflow-y:auto; overscroll-behavior:contain;
  background:var(--sidebar); backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-right:1px solid var(--separator); padding-bottom:var(--s6);
  display:flex; flex-direction:column;
}
.brand{display:flex; align-items:center; gap:var(--s3); padding:var(--s4) var(--s4) var(--s3)}
.brand-mark{
  width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;
  background:linear-gradient(160deg,#0a84ff,#5856d6); color:#fff; font-weight:700; font-size:11px;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.brand-t{font-size:var(--t-head); font-weight:640; letter-spacing:-.015em; line-height:1.15}
.brand-s{font-size:var(--t-cap); color:var(--label-3); letter-spacing:.04em; text-transform:uppercase; font-weight:600}
.nav-group{padding:var(--s2) var(--s2) 0}
.nav-group h4{font-size:var(--t-cap); letter-spacing:.07em; text-transform:uppercase; color:var(--label-3); padding:var(--s3) var(--s3) var(--s1); font-weight:650}
.nav-item{
  display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left;
  padding:7px var(--s3); border-radius:var(--r-sm); border:0; background:none; cursor:pointer;
  color:var(--label); font-size:var(--t-body); min-height:30px; position:relative;
}
.nav-item:hover{background:var(--fill)}
.nav-item[aria-current="page"]{background:var(--tint); color:var(--on-tint); font-weight:560}
.nav-item[aria-current="page"] .nv-i{opacity:1}
.nav-item[aria-current="page"] .nv-c{background:rgba(255,255,255,.24); color:#fff}
.nv-i{width:17px; text-align:center; flex:none; opacity:.75; font-size:13px; line-height:1}
.nv-l{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nv-c{
  font-size:var(--t-cap); font-weight:650; padding:1px 6px; border-radius:9px; min-width:19px;
  text-align:center; background:var(--fill-2); color:var(--label-2);
}
.nv-c.alert{background:var(--red-bg); color:var(--red)}
.side-foot{margin-top:auto; padding:var(--s3) var(--s4) 0; border-top:1px solid var(--separator)}
.who{display:flex; align-items:center; gap:var(--s3); padding:var(--s2) 0}
.avatar{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--fill-2); font-weight:650; font-size:var(--t-foot); color:var(--label-2)}

/* --- main column ---------------------------------------------------------- */
.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:var(--s3);
  padding:var(--s3) var(--s5); min-height:52px;
  background:var(--chrome); backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid transparent; transition:border-color .18s ease;
}
.topbar.scrolled{border-bottom-color:var(--separator)}
.topbar h1{font-size:var(--t-title3); font-weight:640; letter-spacing:-.015em}
.topbar .sub{font-size:var(--t-foot); color:var(--label-2); margin-top:1px}
.tb-grow{flex:1; min-width:0}
.content{padding:var(--s5); max-width:1560px; width:100%}
.content.wide{max-width:none}
.page-lead{font-size:var(--t-body); color:var(--label-2); max-width:74ch; margin-bottom:var(--s4)}

/* ==========================================================================
   controls
   ========================================================================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:28px; padding:5px 12px; border-radius:var(--r-sm); cursor:pointer;
  border:1px solid var(--separator); background:var(--surface); color:var(--label);
  font-size:var(--t-body); font-weight:520; box-shadow:var(--shadow-1);
  transition:background .12s ease, transform .06s ease; white-space:nowrap;
}
.btn:hover{background:var(--fill)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.42; cursor:not-allowed; box-shadow:none}
.btn.primary{background:var(--tint); color:var(--on-tint); border-color:transparent; font-weight:590}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--red); color:#fff; border-color:transparent; font-weight:590}
.btn.ghost{background:none; border-color:transparent; box-shadow:none}
.btn.ghost:hover{background:var(--fill)}
.btn.sm{min-height:24px; padding:2px 9px; font-size:var(--t-foot)}
.btn.lg{min-height:36px; padding:8px 18px; font-size:var(--t-head); border-radius:9px}
.btn.block{width:100%}
.btn-row{display:flex; flex-wrap:wrap; gap:var(--s2)}

.field{display:block; margin-bottom:var(--s3)}
.field > .lbl{display:block; font-size:var(--t-foot); font-weight:590; color:var(--label-2); margin-bottom:5px}
.inp, select.inp, textarea.inp{
  width:100%; padding:6px 10px; min-height:30px; border-radius:var(--r-sm);
  border:1px solid var(--separator-op); background:var(--surface); color:var(--label);
  font-size:var(--t-body); appearance:none;
}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--label-3) 50%),linear-gradient(135deg,var(--label-3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:28px}
textarea.inp{min-height:96px; resize:vertical; line-height:1.6; font-family:var(--f-sys)}
.inp:focus{border-color:var(--blue); outline:2px solid var(--blue-bg); outline-offset:0}
.inp::placeholder{color:var(--label-4)}
.search{position:relative}
.search .inp{padding-left:28px}
.search::before{content:"⌕"; position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--label-3); font-size:14px}

.seg{display:inline-flex; padding:2px; gap:2px; background:var(--fill); border-radius:8px}
.seg button{
  border:0; background:none; cursor:pointer; padding:4px 11px; border-radius:6px;
  font-size:var(--t-foot); font-weight:550; color:var(--label-2); min-height:24px;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--label); box-shadow:var(--shadow-1)}

.switch{display:inline-flex; align-items:center; gap:var(--s2); cursor:pointer; font-size:var(--t-foot)}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{width:34px;height:20px;border-radius:10px;background:var(--fill-3);position:relative;transition:background .16s ease;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .16s ease}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track::after{transform:translateX(14px)}
.switch input:focus-visible + .track{outline:2px solid var(--blue);outline-offset:2px}

/* ==========================================================================
   surfaces
   ========================================================================== */
.card{background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow-1); overflow:hidden}
.card + .card{margin-top:var(--s4)}
.card-h{display:flex; align-items:center; gap:var(--s3); padding:var(--s3) var(--s4); border-bottom:1px solid var(--separator); min-height:42px}
.card-h h3{font-size:var(--t-head); font-weight:620; flex:1; min-width:0}
.card-h .tiny{flex:none}
.card-b{padding:var(--s4)}
.card-b.tight{padding:var(--s3)}
.card-b.flush{padding:0}
.grid{display:grid; gap:var(--s4)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.stack{display:flex; flex-direction:column; gap:var(--s4)}
.row{display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap}
.row.tight{gap:var(--s2)}

/* metric tile */
.tile{background:var(--surface); border-radius:var(--r-md); padding:var(--s3) var(--s4); box-shadow:var(--shadow-1); min-width:0}
.tile .k{font-size:var(--t-foot); color:var(--label-2); font-weight:540; display:flex; align-items:center; gap:5px}
.tile .v{font-size:1.5rem; font-weight:640; letter-spacing:-.02em; line-height:1.15; margin-top:3px}
.tile .v.sm{font-size:1.125rem}
.tile .m{font-size:var(--t-cap); color:var(--label-3); margin-top:2px}
.tile.accent-red .v{color:var(--red)} .tile.accent-orange .v{color:var(--orange)}
.tile.accent-green .v{color:var(--green)} .tile.accent-blue .v{color:var(--blue)}

/* definition list */
.dl{display:grid; grid-template-columns:minmax(120px,34%) minmax(0,1fr); gap:0}
.dl > dt, .dl > dd{padding:6px 0; border-bottom:1px solid var(--separator); margin:0; min-width:0}
.dl > dt{color:var(--label-2); font-size:var(--t-foot); font-weight:540; padding-right:var(--s3)}
.dl > dd{font-size:var(--t-body); overflow-wrap:anywhere}
.dl > dt:last-of-type, .dl > dd:last-of-type{border-bottom:0}

/* ==========================================================================
   tables
   ========================================================================== */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.tbl{width:100%; border-collapse:collapse; font-size:var(--t-foot)}
table.tbl th{
  text-align:left; font-weight:600; color:var(--label-2); font-size:var(--t-cap);
  letter-spacing:.045em; text-transform:uppercase; padding:7px var(--s3); white-space:nowrap;
  border-bottom:1px solid var(--separator); background:var(--surface-2);
  position:sticky; top:0; z-index:2;
}
table.tbl th.sortable{cursor:pointer; user-select:none}
table.tbl th.sortable:hover{color:var(--label)}
table.tbl th .arrow{opacity:.55; margin-left:3px}
table.tbl td{padding:7px var(--s3); border-bottom:1px solid var(--separator); vertical-align:top}
table.tbl tbody tr:hover{background:var(--fill)}
table.tbl tbody tr.clickable{cursor:pointer}
table.tbl tbody tr.sel{background:var(--blue-bg)}
table.tbl tbody tr.sel:hover{background:var(--blue-bg)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td.num, table.tbl th.num{text-align:right; font-variant-numeric:tabular-nums}
table.tbl.dense td, table.tbl.dense th{padding:5px var(--s3)}
.credit{color:var(--green); font-weight:560}
.debit{color:var(--red); font-weight:560}
.empty{padding:var(--s10) var(--s5); text-align:center; color:var(--label-2)}
.empty .big{font-size:1.75rem; margin-bottom:var(--s2); opacity:.5}
.empty h3{font-size:var(--t-title3); margin-bottom:var(--s2); color:var(--label)}
.empty p{max-width:44ch; margin:0 auto var(--s3); font-size:var(--t-foot)}

/* ==========================================================================
   status pills — colour is always paired with a glyph or word
   ========================================================================== */
.pill{
  display:inline-flex; align-items:center; gap:4px; padding:1px 7px; border-radius:5px;
  font-size:var(--t-cap); font-weight:640; letter-spacing:.02em; white-space:nowrap;
  background:var(--fill-2); color:var(--label-2); line-height:1.5;
}
.pill.red{background:var(--red-bg); color:var(--red)}
.pill.orange{background:var(--orange-bg); color:var(--orange)}
.pill.green{background:var(--green-bg); color:var(--green)}
.pill.blue{background:var(--blue-bg); color:var(--blue)}
.pill.purple{background:var(--purple-bg); color:var(--purple)}
.pill.teal{background:var(--teal-bg); color:var(--teal)}
.pill.brown{background:var(--brown-bg); color:var(--brown)}
.pill.lg{font-size:var(--t-foot); padding:3px 9px; border-radius:6px}
.dotp{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* SLA bar */
.sla{display:flex; align-items:center; gap:6px; min-width:118px}
.sla-bar{flex:1; height:5px; border-radius:3px; background:var(--fill-3); overflow:hidden; min-width:40px}
.sla-fill{height:100%; border-radius:3px; background:var(--green); min-width:3px}
.sla-fill.warn{background:var(--orange)} .sla-fill.late{background:var(--red)}
.sla-t{font-size:var(--t-cap); font-weight:620; color:var(--label-2); white-space:nowrap}

/* ==========================================================================

/* ==========================================================================

/* --------------------------------------------------------------------------
   0. Small utilities
   -------------------------------------------------------------------------- */
const $  = (s, r) => (r || document).querySelector(s);

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }
function sum(a, f){ return a.reduce((t,x)=> t + (f?f(x):x), 0); }
function uniq(a){ return Array.from(new Set(a)); }
function byId(a,id){ return a.find(x => x.id === id); }

/* deterministic PRNG so a given case id always builds the same case */
function seedRand(seed){
  let h = 2166136261 >>> 0;
  const s = String(seed);
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return function(){
    h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0;
    return h / 4294967296;
  };
}
function rInt(rnd, lo, hi){ return lo + Math.floor(rnd() * (hi - lo + 1)); }
function rPick(rnd, a){ return a[Math.floor(rnd()*a.length)]; }
function rShuffle(rnd, a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* --------------------------------------------------------------------------
   Currency and number formatting
   -------------------------------------------------------------------------- */
const SYM = { INR:"₹", USD:"$", GBP:"£", EUR:"€", AED:"AED ", SGD:"S$", AUD:"A$", CHF:"CHF ", HKD:"HK$", CAD:"C$" };

function money(n, ccy){
  ccy = ccy || "USD";
  const sym = SYM[ccy] || (ccy + " ");
  const neg = n < 0; n = Math.abs(Math.round(n));
  let out;
  if (ccy === "INR"){
    const s = String(n);
    if (s.length > 3){
      const last3 = s.slice(-3);
      let rest = s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ",");
      out = rest + "," + last3;
    } else out = s;
  } else {
    out = n.toLocaleString("en-US");
  }
  return (neg ? "−" : "") + sym + out;
}
/* compact form for tiles: ₹18.4L / $1.2M */
function moneyShort(n, ccy){
  const sym = SYM[ccy] || (ccy + " ");
  const a = Math.abs(n);
  if (ccy === "INR"){
    if (a >= 1e7) return sym + (n/1e7).toFixed(a>=1e8?0:2) + " Cr";
    if (a >= 1e5) return sym + (n/1e5).toFixed(a>=1e6?0:1) + " L";
    if (a >= 1000) return sym + (n/1000).toFixed(0) + "K";
    return sym + Math.round(n);
  }
  if (a >= 1e9) return sym + (n/1e9).toFixed(2) + "B";
  if (a >= 1e6) return sym + (n/1e6).toFixed(a>=1e7?1:2) + "M";
  if (a >= 1000) return sym + (n/1000).toFixed(a>=1e5?0:1) + "K";
  return sym + Math.round(n);
}
function pct(n){ return (n*100).toFixed(n>=0.1?0:1) + "%"; }
function iso(d){ return new Date(d).toISOString().slice(0,10); }
function addD(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDate(s){
  const d = new Date(s + (String(s).length === 10 ? "T00:00:00" : ""));
  if (isNaN(d)) return s;
  return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
}
function fmtDateShort(s){
  const d = new Date(s + (String(s).length === 10 ? "T00:00:00" : ""));
  if (isNaN(d)) return s;
  return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" });
}
function nowClock(){ const d = new Date(); return d.toTimeString().slice(0,5); }

/* duration in ms -> "6h 12m" / "3d 4h" / "overdue 2h" */
function durHM(ms){
  const neg = ms < 0; ms = Math.abs(ms);
  const mins = Math.floor(ms/60000), h = Math.floor(mins/60), m = mins%60, d = Math.floor(h/24);
  let s;
  if (d >= 1) s = d + "d " + (h%24) + "h";
  else if (h >= 1) s = h + "h " + m + "m";
  else s = m + "m";
  return (neg ? "−" : "") + s;
}

sh, with no till, assay, weighbridge, VAT, insurance or transit records, and no evidence of a collection operation. The physical condition and geographic spread of the notes are inconsistent with takings from public counter purchases in Yorkshire.\n\nTypology: placement of cash proceeds through a cash-intensive business, layered out through a precious-metals supply chain to an overseas refiner. Source of funds for approximately 98.8% of the cash is unevidenced.\n\nRecommendation: escalate to the MLRO for SAR consideration, with a recommendation to exit the relationship subject to MLRO consent and tipping-off constraints. Refer separately: the unexplained 2013 risk downgrade, the eleven uninvestigated referrals, and the cash-coded-as-cheque monitoring defect, which is a systemic control failure affecting a population of customers rather than an issue confined to this account."

    what:"Based on the Russian mirror-trading scheme resolved by the New York Department of Financial Services and the FCA against Deutsche Bank in January 2017. Documented facts: clients of the Moscow equities desk placed orders to buy Russian blue-chip stocks paying in roubles, typically USD 2–3m per order; shortly afterwards a related counterparty, typically registered offshore, sold the identical stock in the same quantity at the same price through the London branch, with the seller paid in US dollars cleared through the bank's New York trust company. The trades had no legitimate economic rationale and counterparties frequently lost money after fees and commissions, which were substantially credited to the Moscow desk. It made no difference to the counterparties which security was traded, only that a matching trade was available; in one exchange a counterparty representative stated the size to be traded and asked the desk to find a security to fit. Where mirror trades could not be arranged, value was parked in other securities of equivalent size. The consent order records that companies owned by a close relative of a Deutsche Bank supervisor received payments described as financial consulting, ultimately around USD 3.8 million, including USD 250,000 wired by a mirror-trading client in 2015, although that relative's background was in art history rather than finance. The scheme moved more than USD 10 billion out of Russia. DFS imposed a USD 425m penalty and required an independent monitor; the FCA imposed GBP 163m, at the time its largest anti-money-laundering penalty.",

s and that timing overlap is coincidental. This is contradicted by common formation, cross-held powers of attorney, identical trade sizes and execution within minutes across 214 occasions.\n\nTypology: mirror trading used to move value out of Russia, converting roubles held domestically into US dollars held offshore, with securities transactions used as the layering mechanism. Source of funds for the rouble legs is not evidenced and no source of wealth has ever been obtained.\n\nRecommendation: escalate to the MLRO for SAR consideration, covering both counterparties as a linked relationship. Given US dollar clearing through the New York entity, recommend the MLRO consider correspondent banking notification obligations. Refer the consulting payments to the supervisor's relative to internal investigations as a potential conflict of interest and staff conduct matter, and refer the desk-closed alert dispositions for control review."

/* --------------------------------------------------------------------------
   5. Ledger composer
   A case seed describes its activity as a sequence of segments. The composer
   turns segments into a dated, balanced transaction ledger. This keeps seeds
   compact while producing genuinely different transaction shapes rather than
   the same ledger with different names.
   -------------------------------------------------------------------------- */

const NAME_POOL = {
  IN:{ f:["Aniket","Priya","Rohit","Meera","Suresh","Kavita","Imran","Deepa","Vikram","Lakshmi","Farhan","Anjali","Rajesh","Neha","Sanjay","Pooja","Arun","Divya","Nikhil","Shreya"],
       l:["Bhosale","Iyer","Nair","Deshmukh","Patel","Reddy","Sheikh","Kulkarni","Menon","Rao","Qureshi","Joshi","Pillai","Gupta","Shetty","Bose","Chauhan","Verma","Salgaonkar","Mehra"] },
  UK:{ f:["Daniel","Grace","Oliver","Amelia","Idris","Chloe","Marcus","Priya","Tomasz","Ruth","Callum","Nadia","Ethan","Sophie","Leon","Hannah"],
       l:["Whitmore","Adeyemi","Baptiste","Kowalski","Osei","Fairhurst","Nowak","Danquah","Bellamy","Okonjo","Hartley","Vasilenko","Marsden","Ibrahim","Lindqvist","Ferreira"] },
  US:{ f:["Marcus","Elena","Devon","Camila","Aaron","Rosa","Tyler","Yolanda","Curtis","Bianca","Nathan","Selena","Trevor","Dana","Miguel","Paulette"],
       l:["Whitfield","Vasquez","Okafor","Delgado","Brennan","Santos","Rivera","Chen","Mbeki","Cardenas","Larkin","Ferreira","Nguyen","Kowalczyk","Estrada","Duarte"] },
  EU:{ f:["Marta","Tomasz","Elif","Lucas","Ingrid","Andrei","Sofia","Mateo","Katrin","Dimitri","Nora","Pavel","Lena","Goran","Ines","Rasmus"],
       l:["Novak","Kaya","Bergström","Petrescu","Lindqvist","Vandenberg","Moreau","Duarte","Weiss","Sokolov","Jansen","Marchetti","Halvorsen","Popescu","Ferreira","Andersson"] },
  MX:{ f:["Miguel","Rosa","Javier","Lucia","Ernesto","Marisol","Rafael","Carmen","Hector","Alba","Ramon","Isabel"],
       l:["Delgado","Vargas","Ibarra","Cardenas","Munoz","Salazar","Zamora","Escobar","Trevino","Aguilar","Ochoa","Villalobos"] }
};
const ENT_A = ["Vikrant","Harsh","Meridian","Blackwater","Silverline","Kestrel","Orion","Torrent","Larkspur","Ironvale","Northgate","Calder","Ravensworth","Sableridge","Quantum","Aurelia","Belmont","Cygnet","Drayton","Eastwick"];
const ENT_B = ["Enterprises","Tradelink","Holdings","Trading FZE","Ventures","Logistics","Commodities","Global Ltd","Consulting","Exports","Services LLC","Imports","Group","Capital","Partners","Distribution","Sourcing","Marketing","Industries","Solutions"];

function nameGen(rnd, pool){
  const p = NAME_POOL[pool] || NAME_POOL.US;
  return rPick(rnd, p.f) + " " + rPick(rnd, p.l);
}
function entGen(rnd){ return (rPick(rnd, ENT_A) + " " + rPick(rnd, ENT_B)).toUpperCase(); }

/* --- one segment -> transactions ----------------------------------------- */
/* segment fields
   t     segment type: base | in | out | pair | sweep | cycle | single | gap
   n     count            lo/hi  amount band        exact  fixed amount
   m     method           ch     channel            cc     country code
   cp    counterparty: literal string, "@people", "@entities", "@sites", or array
   days  days the segment spans     every  fixed day interval
   note  per-transaction note       desc   narrative description
   ratio for sweep: proportion of accumulated credits to move out
   to    for sweep/out: beneficiary name or array
*/
function composeLedger(seed, rnd){
  const g = seed.gen || {};
  const ccy = seed.ccy || inst(seed.inst).ccy;
  const pool = g.pool || (ccy === "INR" ? "IN" : ccy === "GBP" ? "UK" : ccy === "EUR" ? "EU" : "US");
  const start = new Date((g.start || "2025-01-06") + "T00:00:00");
  const home = g.cc || (ccy === "INR" ? "IN" : ccy === "GBP" ? "GB" : ccy === "EUR" ? "DE" : "US");

  /* stable name pools reused across the case so the graph is coherent */
  const people = [], entities = [], sites = (g.sites || ["Main branch"]);
  for (let i=0;i<26;i++) people.push(nameGen(rnd, pool));
  for (let i=0;i<12;i++) entities.push(entGen(rnd));

  let bal = g.openBal != null ? g.openBal : Math.round((g.lo || 1000) * 2.4);
  let day = 0, id = 1;
  const txns = [];
  const usedPeople = [], usedEnt = [];

  function resolveCp(cp, i){
    if (Array.isArray(cp)) return cp[i % cp.length];
    if (cp === "@people"){ const v = people[i % people.length]; if (usedPeople.indexOf(v)<0) usedPeople.push(v); return v; }
    if (cp === "@entities"){ const v = entities[i % entities.length]; if (usedEnt.indexOf(v)<0) usedEnt.push(v); return v; }
    if (cp === "@sites") return "Cash deposit — " + sites[i % sites.length];
    return cp || "Counterparty";
  }
  function push(o){
    const amt = Math.max(1, Math.round(o.amt));
    bal = o.dir === "C" ? bal + amt : bal - amt;
    if (bal < 0) bal = Math.round(amt * 0.03);
    txns.push({
      id: id++, d: iso(addD(start, o.day)), t: o.time || (String(rInt(rnd,8,20)).padStart(2,"0")+":"+String(rInt(rnd,0,59)).padStart(2,"0")),
      dir: o.dir, amt: amt, m: o.m || "Transfer", cp: o.cp, cc: o.cc || home,
      desc: o.desc || "", ch: o.ch || "Mobile", loc: o.loc || "", bal: bal, note: o.note || ""
    });
  }

  (seed.gen && seed.gen.flow || []).forEach(seg => {
    const type = seg.t;
    const span = seg.days != null ? seg.days : (seg.n || 1) * 2;
    if (type === "gap"){ day += (seg.days || 90); return; }

    if (type === "single"){
      push({ day: day + (seg.at||0), dir: seg.dir || "C", amt: seg.exact != null ? seg.exact : rInt(rnd, seg.lo, seg.hi),
             m: seg.m, cp: resolveCp(seg.cp, 0), cc: seg.cc, desc: seg.desc, ch: seg.ch, loc: seg.loc, note: seg.note, time: seg.time });
      day += (seg.days || 1); return;
    }

    if (type === "base" || type === "in" || type === "out"){
      const n = seg.n || 1;
      for (let i=0;i<n;i++){
        const off = seg.every ? i * seg.every : Math.round(i * (span / Math.max(1,n-0.001)));
        let amt;
        if (seg.exact != null) amt = seg.exact;
        else if (seg.round) amt = Math.round(rInt(rnd, seg.lo, seg.hi) / seg.round) * seg.round;
        else amt = rInt(rnd, seg.lo, seg.hi);
        push({ day: day + off, dir: type === "out" ? "D" : (seg.dir || "C"), amt: amt, m: seg.m,
               cp: resolveCp(seg.cp, i), cc: Array.isArray(seg.cc) ? seg.cc[i % seg.cc.length] : seg.cc,
               desc: seg.desc, ch: seg.ch, loc: Array.isArray(seg.loc) ? seg.loc[i % seg.loc.length] : seg.loc,
               note: (i === 0 ? seg.note : (seg.noteAll ? seg.note : "")) });
      }
      day += span + (seg.after || 0); return;
    }

    if (type === "pair"){                       /* in then out shortly after */
      const n = seg.n || 3;
      for (let i=0;i<n;i++){
        const off = Math.round(i * (span / Math.max(1,n-0.001)));
        const amt = seg.exact != null ? seg.exact : rInt(rnd, seg.lo, seg.hi);
        push({ day: day+off, dir:"C", amt: amt, m: seg.m, cp: resolveCp(seg.cp, i),
               cc: Array.isArray(seg.cc)?seg.cc[i%seg.cc.length]:seg.cc, desc: seg.desc, ch: seg.ch, note: i===0?seg.note:"" });
        push({ day: day+off+(seg.lag||0), dir:"D", amt: Math.round(amt * (seg.keep != null ? (1-seg.keep) : 0.97)),
               m: seg.mOut || seg.m, cp: resolveCp(seg.to || "@entities", i),
               cc: Array.isArray(seg.ccOut)?seg.ccOut[i%seg.ccOut.length]:(seg.ccOut||seg.cc), desc: seg.descOut || seg.desc, ch: seg.chOut || seg.ch });
      }
      day += span + (seg.after||0); return;
    }

    if (type === "sweep"){                      /* consolidate recent credits */
      const since = seg.since != null ? seg.since : 0;
      const credits = txns.filter(x => x.dir === "C").slice(since);
      const total = sum(credits, x => x.amt);
      const parts = seg.parts || 1;
      const moving = total * (seg.ratio != null ? seg.ratio : 0.94);
      for (let i=0;i<parts;i++){
        push({ day: day + (seg.at || 0) + i*(seg.every||1), dir:"D", amt: moving/parts, m: seg.m,
               cp: resolveCp(seg.to, i), cc: seg.cc, desc: seg.desc, ch: seg.ch, note: i===0?seg.note:"" });
      }
      day += (seg.days || 1); return;
    }

    if (type === "cycle"){                      /* repeating collect-and-pay */
      const cycles = seg.cycles || 3, per = seg.n || 8;
      for (let c=0;c<cycles;c++){
        let tot = 0;
        for (let i=0;i<per;i++){
          const amt = seg.exact != null ? seg.exact : rInt(rnd, seg.lo, seg.hi);
          tot += amt;
          push({ day: day + c*(seg.every||30) + i, dir:"C", amt: amt, m: seg.m, cp: resolveCp(seg.cp, c*per+i),
                 cc: seg.cc, desc: seg.desc, ch: seg.ch });
        }
        push({ day: day + c*(seg.every||30) + per + (seg.lag||1), dir:"D", amt: tot * (seg.ratio != null ? seg.ratio : 0.97),
               m: seg.mOut || seg.m, cp: resolveCp(seg.to || "@people", c), cc: seg.ccOut || seg.cc,
               desc: seg.descOut || "Payout", ch: seg.chOut || seg.ch });
      }
      day += cycles * (seg.every||30); return;
    }
  });

  /* interleave chronologically, then renumber */
  txns.sort((a,b) => (a.d + a.t).localeCompare(b.d + b.t));
  let running = g.openBal != null ? g.openBal : Math.round((g.lo || 1000) * 2.4);
  txns.forEach((x,i) => {
    x.id = i + 1;
    running = x.dir === "C" ? running + x.amt : running - x.amt;
    if (running < 0) running = Math.round(x.amt * 0.02);
    x.bal = running;
  });
  return { txns, people: usedPeople.length ? usedPeople : people.slice(0,8), entities: usedEnt.length ? usedEnt : entities.slice(0,4) };
}

/* ---- helpers over a ledger ---------------------------------------------- */
function ledgerStats(txns){
  const cr = txns.filter(t => t.dir === "C"), db = txns.filter(t => t.dir === "D");
  const inV = sum(cr, t => t.amt), outV = sum(db, t => t.amt);
  return {
    n: txns.length, nIn: cr.length, nOut: db.length, inV, outV,
    total: inV + outV,
    ratio: inV ? outV / inV : 0,
    from: txns.length ? txns[0].d : "", to: txns.length ? txns[txns.length-1].d : "",
    days: txns.length ? Math.max(1, Math.round((new Date(txns[txns.length-1].d) - new Date(txns[0].d)) / 86400000)) : 1,
    cps: uniq(txns.map(t => t.cp)),
    ccs: uniq(txns.map(t => t.cc)),
    methods: uniq(txns.map(t => t.m)),
    channels: uniq(txns.map(t => t.ch).filter(Boolean)),
    maxCr: cr.length ? Math.max.apply(null, cr.map(t=>t.amt)) : 0,
    minBal: txns.length ? Math.min.apply(null, txns.map(t=>t.bal)) : 0
  };
}

/* counterparty records derived from the ledger, enriched by seed overrides */
function buildCounterparties(txns, seed, ccy, rnd){
  const map = new Map();
  txns.forEach(t => {
    const k = t.cp;
    if (!map.has(k)) map.set(k, { name:k, cc:t.cc, n:0, inV:0, outV:0, first:t.d, last:t.d, methods:new Set(), dirs:new Set() });
    const r = map.get(k);
    r.n++; r.last = t.d; if (t.d < r.first) r.first = t.d;
    if (t.dir === "C") r.inV += t.amt; else r.outV += t.amt;
    r.methods.add(t.m); r.dirs.add(t.dir);
  });
  const over = {}; (seed.cps || []).forEach(c => { over[c.name] = c; });
  const out = [];
  map.forEach(r => {
    const o = over[r.name] || {};
    const isCash = /^Cash deposit|^Cash withdrawal|^ATM /i.test(r.name);
    const isEnt = /[A-Z]{3,}\s|LLC|LTD|LIMITED|FZE|GMBH|PVT|INC|SARL|BV|PLC|CO\.|OÜ|S\.A\./.test(r.name) || o.type === "entity";
    out.push({
      name: r.name,
      type: o.type || (isCash ? "cash" : isEnt ? "entity" : "individual"),
      cc: o.cc || r.cc,
      customer: o.customer != null ? o.customer : false,
      biz: o.biz || (isEnt ? "Not established from available records" : ""),
      rel: o.rel || "Not declared in the customer's beneficiary or expected-counterparty record",
      n: r.n, inV: r.inV, outV: r.outV, total: r.inV + r.outV,
      first: r.first, last: r.last,
      methods: Array.from(r.methods), dirs: Array.from(r.dirs),
      added: o.added || "",
      purpose: o.purpose || "",
      flags: o.flags || [],
      note: o.note || "",
      screening: o.screening || "No sanctions, PEP or law-enforcement match returned on the name as presented.",
      accounts: o.accounts || "",
      benign: !!o.benign
    });
  });
  out.sort((a,b) => b.total - a.total);
  return out;
}

/* beneficiaries = outbound payees with payee-list metadata (§12) */
function buildBeneficiaries(cps, txns, seed, ccy){
  return cps.filter(c => c.outV > 0 && c.type !== "cash").map(c => {
    const rows = txns.filter(t => t.cp === c.name && t.dir === "D");
    return {
      name: c.name, cc: c.cc, type: c.type,
      account: c.accounts || ("****" + String(Math.abs(hashCode(c.name)) % 9000 + 1000)),
      added: c.added || rows.length ? (c.added || "") : "",
      addedNote: c.added ? "" : "Beneficiary-list metadata not held for this payee.",
      n: rows.length, total: sum(rows, r => r.amt),
      first: rows.length ? rows[0].d : "", last: rows.length ? rows[rows.length-1].d : "",
      purpose: c.purpose || "No payment purpose recorded by the customer",
      rel: c.rel, biz: c.biz, screening: c.screening, note: c.note, flags: c.flags
    };
  });
}
function hashCode(s){ let h=0; for(let i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h|=0; } return h; }

/* relationship graph (§10) */
function buildGraph(c){
  const nodes = [{ id:"CUST", kind:"customer", label:c.customer.name, sub:c.customer.product, cc:c.customer.cc }];
  const edges = [];
  const top = c.counterparties.slice(0, 13);
  top.forEach((cp, i) => {
    const id = "N" + i;
    nodes.push({ id, kind: cp.type === "cash" ? "cash" : cp.type === "entity" ? "entity" : cp.customer ? "customer" : "party",
                 label: cp.name, sub: ctryName(cp.cc), cc: cp.cc, cpIndex: c.counterparties.indexOf(cp) });
    if (cp.inV > 0) edges.push({ a:id, b:"CUST", kind:"transfer", v:cp.inV, n:cp.n, label:moneyShort(cp.inV, c.ccy) + " in" });
    if (cp.outV > 0) edges.push({ a:"CUST", b:id, kind:"transfer", v:cp.outV, n:cp.n, label:moneyShort(cp.outV, c.ccy) + " out" });
  });
  (c.links || []).forEach((l, i) => {
    const aId = nodes.find(n => n.label === l.a), bId = nodes.find(n => n.label === l.b);
    if (aId && bId) edges.push({ a:aId.id, b:bId.id, kind:l.kind || "link", label:l.label || l.kind, dashed:true });
    else if (l.newNode){
      const id = "X" + i;
      nodes.push({ id, kind:l.kind === "address" ? "address" : "entity", label:l.b, sub:l.sub || "", cc:l.cc || "" });
      const src = nodes.find(n => n.label === l.a) || nodes[0];
      edges.push({ a:src.id, b:id, kind:l.kind || "link", label:l.label || l.kind, dashed:true });
    }
  });
  return { nodes, edges };
}

/* ---- default investigation actions -------------------------------------- */
function defaultRequests(c, seed){
  const st = c.stats, ccy = c.ccy;
  const cashTx = c.txns.filter(t => /cash/i.test(t.m));
  const benes = c.beneficiaries.slice(0,3).map(b => b.name);
  const R = [];
  const add = o => { if (!R.some(x => x.id === o.id)) R.push(o); };

  add({ id:"prior", to:"ops", cat:"Account history", label:"Pull previous 12 months of account activity",
    resp: seed.priorResp || ("Trailing 12 months to the start of the review period: average monthly turnover " +
      money(Math.round(st.inV / Math.max(1, st.days/30) * (seed.priorFactor != null ? seed.priorFactor : 0.12)), ccy) +
      ", highest single credit " + money(Math.round(st.maxCr * (seed.priorFactor != null ? seed.priorFactor : 0.18)), ccy) +
      ", counterparties limited to " + (seed.priorCps || "salary credit, utility debits and a small number of repeat retail payees") +
      ". The activity in the review window is a step change against that baseline rather than a continuation of it.") });

  add({ id:"bene", to:"ops", cat:"Counterparty", label:"Retrieve beneficiary-list records for outbound payees",
    resp: seed.beneResp || ("Payee records retrieved for " + c.beneficiaries.length + " outbound beneficiaries" +
      (benes.length ? " including " + benes.join(", ") : "") + ". " +
      (c.beneficiaries.filter(b=>b.added).length ? "Addition dates are held and are shown on the Entities screen." :
       "Addition dates are held on the payee record and are shown on the Entities screen.") +
      " Outbound value to the top three beneficiaries represents " +
      pct(st.outV ? sum(c.beneficiaries.slice(0,3), b=>b.total)/st.outV : 0) + " of all outbound value in the window.") });

  add({ id:"remit", to:"ops", cat:"Counterparty", label:"Analyse inbound remitter population",
    resp: seed.remitResp || (c.counterparties.filter(x=>x.inV>0).length + " distinct inbound counterparties identified. " +
      "None appears in the customer's declared expected-counterparty list. No reciprocal payments run from the customer to any inbound payer in the window.") });

  if (cashTx.length) add({ id:"cash", to:"ops", cat:"Cash", label:"Obtain cash deposit records and CCTV where available",
    resp: seed.cashResp || (cashTx.length + " cash transactions totalling " + money(sum(cashTx,t=>t.amt), ccy) +
      ", presented at " + uniq(cashTx.map(t=>t.loc||t.cp)).length + " locations. Individual values range " +
      money(Math.min.apply(null,cashTx.map(t=>t.amt)), ccy) + "–" + money(Math.max.apply(null,cashTx.map(t=>t.amt)), ccy) +
      ". " + (c.institution.thresholds ? "The institution's " + c.institution.thresholds.label + " is " + money(c.institution.thresholds.cash, ccy) + "." : "")) });

  add({ id:"device", to:"fraud", cat:"Network", label:"Request device, IP and related-account analysis",
    resp: seed.deviceResp || "Fraud Team returned the device and session record for the review period. No fraud markers are recorded against the customer. The team notes that device linkage alone establishes shared access, not shared control, and should be read with the transaction pattern." });

  add({ id:"kycfile", to:"kyc", cat:"KYC", label:"Request the full KYC file and last review notes",
    resp: seed.kycResp || ("KYC file retrieved. Identity and address verification are on file and current. The customer profile was last refreshed at " +
      (c.customer.kyc.review || "the date shown on the KYC tab") + "; expected activity recorded at that review is shown on the Expected activity tab. No source-of-wealth documentation is held beyond the declaration made at onboarding.") });

  add({ id:"rm", to:"rm", cat:"Relationship", label:"Ask the relationship manager for background",
    resp: seed.rmResp || "Relationship manager has no recent contact recorded with the customer and no knowledge of a change in circumstances. The RM notes that the relationship is serviced digitally and that they have not met the customer." });

  add({ id:"sanc", to:"sanctions", cat:"Screening", label:"Refer names to the Sanctions Team for screening",
    resp: null, kind:"sanctions" });

  add({ id:"media", to:"external", cat:"Screening", label:"Run adverse media and open-source research",
    resp: null, kind:"media" });

  add({ id:"amlhist", to:"aml", cat:"History", label:"Check internal AML history and linked-case register",
    resp: seed.amlResp || ("Internal register returns " + (c.customer.history.alerts || "no prior alert") +
      " for this customer. " + (seed.amlExtra || "No linked internal case is open against the counterparties named in this alert.")) });

  if (c.institution.id === "invest" || c.institution.id === "paymentinst" || st.ccs.length > 1)
    add({ id:"corr", to:"corr", cat:"Correspondent", label:"Query the correspondent bank on intermediary routing",
      resp: seed.corrResp || "Correspondent confirms the routing shown in the payment messages and provides the ordering and beneficiary institution details already visible on the transactions. No further originator information was held beyond that supplied in the message." });

  add({ id:"explain", to:"customer", cat:"Customer", label:"Request the customer's explanation of the activity",
    resp: seed.explain || "Customer declined to provide a narrative explanation and asked that any query be put in writing.", quote:true });

  add({ id:"proof", to:"customer", cat:"Customer", label:"Request supporting documents from the customer",
    resp: seed.proof || "No documents were produced within the period allowed." });

  (seed.reqs || []).forEach(r => {
    const i = R.findIndex(x => x.id === r.id);
    if (i >= 0) R[i] = Object.assign({}, R[i], r); else R.push(r);
  });
  return R;
}

/* ---- model disposition composed from the case's own record --------------- */
function composeModel(c){
  const st = c.stats, ccy = c.ccy, P = [];
  const r = rule(c.alert.ruleId);
  P.push("Alert " + c.alert.ref + " was raised by rule " + r.code + " (" + r.name + ") over the period " +
    c.alert.period + ". The rule measured " + st.n + " transactions totalling " + money(st.total, ccy) + " — " +
    money(st.inV, ccy) + " credited across " + st.nIn + " entries and " + money(st.outV, ccy) + " debited across " +
    st.nOut + " entries — against the customer's profiled expectation of " + c.customer.expected.turnover + ".");

  P.push("The customer is " + c.customer.summary + " The relationship has been held since " + c.customer.since +
    " and is rated " + (RISK[c.customer.risk]||{label:c.customer.risk}).label.toLowerCase() + " risk. Declared source of funds is " +
    c.customer.kyc.sof + "; declared source of wealth is " + c.customer.kyc.sow + ". Expected activity recorded at the last KYC review was " +
    c.customer.expected.types + ", with counterparties expected to be " + c.customer.expected.cps + " and geographies " +
    c.customer.expected.geos + ".");

  const topIn = c.counterparties.filter(x=>x.inV>0).slice(0,3).map(x => x.name + " (" + money(x.inV,ccy) + ")");
  const topOut = c.counterparties.filter(x=>x.outV>0).slice(0,3).map(x => x.name + " (" + money(x.outV,ccy) + ")");
  P.push("Transaction analysis. " + (topIn.length ? "Principal inbound counterparties are " + topIn.join(", ") + ". " : "") +
    (topOut.length ? "Principal outbound counterparties are " + topOut.join(", ") + ". " : "") +
    "Outbound value represents " + pct(st.ratio) + " of inbound value over the window and the lowest balance recorded is " +
    money(st.minBal, ccy) + ". Countries touched: " + st.ccs.map(ctryName).join(", ") + ". Channels used: " +
    (st.channels.join(", ") || st.methods.join(", ")) + ".");

  if (c.flags.length) P.push("Indicators identified. " + c.flags.map((f,i) => (i+1) + ") " + f.t).join(". ") + ".");
  if (c.traps && c.traps.length) P.push("Features considered and discounted. " + c.traps.map(t => t.t).join(" ") );

  P.push("Screening. Sanctions: " + SANC_KIND[c.sanctions.kind].label.toLowerCase() + ". Adverse media: " +
    MEDIA_KIND[c.media.kind].label.toLowerCase() + ". " +
    (c.sanctions.kind === "potential" ? "The sanctions position is a potential match only and is not treated as confirmed in this assessment. " : "") +
    (c.media.kind === "unconfirmed" ? "Media information is uncorroborated and is treated as a prompt for enquiry rather than as evidence. " : ""));

  P.push("Customer explanation and evidence. " + (c.explanationSummary || "No explanation was obtained.") + " " +
    (c.evidenceSummary || ""));

  P.push("Assessment. " + (c.assessment || "") + " Potential typology: " + c.typology.join("; ") + ".");

  const dec = c.outcome;
  P.push("Recommendation: " + (dec === "escalate"
      ? "escalate to the MLRO for consideration of a suspicious activity report under the institution's procedures. This recommendation records that the activity is unusual and unexplained on the evidence available; it is not a determination that an offence has been committed, which is not the analyst's decision to make."
      : dec === "edd" ? "retain the case in enhanced due diligence pending the outstanding information identified above. Material questions remain open and the evidence currently held supports neither closure nor escalation."
      : "close with no suspicion. The activity is unusual against the recorded profile but is reasonably explained and independently corroborated.") +
    (c.residual ? " Residual actions: " + c.residual : ""));
  return P.join("\n\n");
}

/* ---- main expansion ------------------------------------------------------ */
function buildCase(seed){
  const rnd = seedRand(seed.id);
  const I = inst(seed.inst);
  const ccy = seed.ccy || I.ccy;
  const led = composeLedger(seed, rnd);
  const txns = led.txns;
  const st = ledgerStats(txns);
  const cu = seed.cust || {};
  const priority = seed.priority || (seed.level >= 4 ? "critical" : seed.level === 3 ? "high" : seed.level === 2 ? "high" : "medium");

  const c = {
    id: seed.id, kind: seed.kind, level: seed.level, inst: I.id, institution: I, ccy,
    title: seed.title, seed,
    stats: st, txns,
    txnNote: seed.txnNote || ("Extract shows all " + txns.length + " transactions captured by the rule in the review window. Activity outside the window is available through the account history request."),
    alert: {
      ref: seed.ref || ("AL-" + (Math.abs(hashCode(seed.id)) % 90000 + 10000)),
      ruleId: seed.rule, date: st.to, period: fmtDate(st.from) + " – " + fmtDate(st.to),
      priority, risk: seed.risk || (seed.level >= 4 ? "critical" : seed.level >= 3 ? "high" : "medium"),
      count: st.n, amount: st.total, ccy,
      product: cu.product || I.products[0],
      channel: st.channels[0] || st.methods[0] || I.channels[0],
      countries: st.ccs, nCps: st.cps.length,
      prior: cu.priorAlerts || "None recorded",
      trigger: seed.trigger || null
    },
    customer: {
      id: seed.custId || ("C-" + (Math.abs(hashCode(seed.id + "c")) % 900000 + 100000)),
      name: cu.name || nameGen(rnd, ccy==="INR"?"IN":ccy==="GBP"?"UK":ccy==="EUR"?"EU":"US"),
      age: cu.age || "", since: cu.since || "", occ: cu.occ || "", employer: cu.employer || "",
      income: cu.income || "", address: cu.address || "", city: cu.city || "", cc: cu.cc || (st.ccs[0]||"US"),
      ctype: cu.ctype || I.customerTypes[0], risk: cu.risk || "low",
      product: cu.product || I.products[0], purpose: cu.purpose || "Not restated since onboarding",
      summary: cu.summary || ((cu.age? cu.age + "-year-old ":"") + (cu.occ||"customer") + (cu.city ? " resident in " + cu.city : "") + "."),
      products: cu.products || [{ name: cu.product || I.products[0], num:"****"+(Math.abs(hashCode(seed.id))%9000+1000), opened: cu.since||"", status:"Active", bal: st.minBal }],
      expected: {
        turnover: cu.expTurn || "not recorded at last review",
        types: cu.expTypes || "not recorded at last review",
        geos: cu.expCtry || "domestic only",
        cps: cu.expCps || "not recorded at last review",
        cash: cu.expCash || "no cash activity expected"
      },
      kyc: {
        idv: cu.idv || "Verified at onboarding — government photo identity, electronically validated",
        adv: cu.adv || "Verified at onboarding — utility statement",
        occ: cu.occ || "", sof: cu.sof || "Not evidenced beyond declaration",
        sow: cu.sow || "Not evidenced beyond declaration",
        review: cu.kycDate || "", assess: cu.kycAssess || "Standard due diligence applied; no enhanced measures recorded.",
        pep: cu.pep || "Not identified as a politically exposed person at onboarding or subsequent screening."
      },
      history: {
        alerts: cu.priorAlerts || "No previous alert",
        cases: cu.priorCases || "No previous case",
        edd: cu.priorEdd || "No enhanced due diligence previously performed",
        expl: cu.priorExpl || "No previous customer explanation held on file",
        risk: cu.riskHist || "Risk rating unchanged since onboarding"
      }
    },
    flags: seed.flags || [], traps: seed.traps || [], typology: seed.typology || [],
    outcome: seed.outcome, hints: seed.hints || [],
    keyTxn: seed.keyTxn || [], keyReq: seed.keyReq || [],
    reveal: seed.reveal || {}, links: seed.links || [],
    explanationSummary: seed.explanationSummary || "", evidenceSummary: seed.evidenceSummary || "",
    assessment: seed.assessment || "", residual: seed.residual || "",
    media: Object.assign({ kind: seed.media || "none", items: seed.mediaItems || [] }, {}),
    sanctions: Object.assign({ kind: seed.sanctions || "none", items: seed.sancItems || [] }, {}),
    docs: seed.docs || []
  };

  c.counterparties = buildCounterparties(txns, seed, ccy, rnd);
  c.beneficiaries  = buildBeneficiaries(c.counterparties, txns, seed, ccy);
  c.graph = buildGraph(c);
  c.requests = defaultRequests(c, seed);

  /* key transactions default: the largest movements and any noted rows */
  if (!c.keyTxn.length){
    const noted = txns.filter(t => t.note).map(t => t.id);
    const big = txns.slice().sort((a,b)=>b.amt-a.amt).slice(0, Math.min(8, Math.ceil(txns.length*0.35))).map(t=>t.id);
    c.keyTxn = uniq(noted.concat(big));
  }
  if (!c.keyReq.length) c.keyReq = ["prior","bene","explain","sofsow"].concat(seed.extraKeyReq || []);
  if (!c.hints.length) c.hints = defaultHints(c);
  c.model = seed.model || composeModel(c);
  return c;
}

function defaultHints(c){
  const r = rule(c.alert.ruleId);
  return [
    "Start with the mechanics: " + r.mech.charAt(0).toLowerCase() + r.mech.slice(1).replace(/\.$/,"") + ". Establish what the numbers actually are before forming a view.",
    "The question the rule cannot answer is " + r.watch.charAt(0).toLowerCase() + r.watch.slice(1).replace(/\.$/,"") + ". Look for evidence on that, not for confirmation of a theory.",
    "Test the explanation against the record rather than against plausibility: does the documentary evidence reconcile to the ledger, and what in the account contradicts what you have been told?"
  ];
}

/* --------------------------------------------------------------------------
   10. Case registry, state and persistence
   -------------------------------------------------------------------------- */
const CASE_INDEX = [];        /* light records for listing */
const CASE_CACHE = {};        /* id -> built case */

function registerCases(){
  AUTHORED.forEach(a => {
    const meta = AUTHORED_META[a.id] || {};
    CASE_INDEX.push({ id:a.id, kind:a.kind, level:a.level, inst:meta.inst || "retail",
      title:a.listTitle, rule:AUTHORED_RULE[a.id] || "PROFILE", outcome:a.outcome,
      priority:meta.priority || "high", src:"authored" });
  });
  SEEDS.forEach(s => {
    CASE_INDEX.push({ id:s.id, kind:s.kind, level:s.level, inst:s.inst, title:s.title,
      rule:s.rule, outcome:s.outcome, priority:s.priority ||
        (s.level >= 4 ? "critical" : s.level >= 2 ? "high" : "medium"), src:"seed" });
  });
}
function getCase(id){
  if (CASE_CACHE[id]) return CASE_CACHE[id];
  const a = AUTHORED.find(x => x.id === id);
  if (a) return (CASE_CACHE[id] = adaptAuthored(a));
  const s = SEEDS.find(x => x.id === id);
  if (s) return (CASE_CACHE[id] = buildCase(s));
  const g = GENERATED[id];
  if (g) return (CASE_CACHE[id] = buildCase(g));
  return null;
}

/* --- persistence: localStorage with an in-memory fallback ---------------- */
let MEM = {};
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v == null ? MEM[k] : v; } catch(e){ return MEM[k]; } },
  set(k, v){ MEM[k] = v; try { localStorage.setItem(k, v); } catch(e){} }
};
const PKEY = "sentinel:tm:v1";
let PROG = {
  onboarded:false, inst:"retail", role:"senior", analyst:"", theme:"", textScale:1,
  completed:{},          /* caseId -> record */
  work:{},               /* caseId -> live working state */
  queue:[],              /* assigned alert records */
  genCount:0, seenTypologies:[], sessionStart:Date.now(), lastNav:"dashboard"
};
function saveProg(){
  try {
    const copy = Object.assign({}, PROG);
    copy.work = {};
    Object.keys(PROG.work).forEach(k => {
      const w = PROG.work[k];
      copy.work[k] = Object.assign({}, w, { flags: Array.from(w.flags || []), viewed: Array.from(w.viewed || []) });
    });
    store.set(PKEY, JSON.stringify(copy));
  } catch(e){}
}
function loadProg(){
  try {
    const raw = store.get(PKEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    PROG = Object.assign(PROG, p);
    Object.keys(PROG.work || {}).forEach(k => {
      const w = PROG.work[k];
      w.flags = new Set(w.flags || []);
      w.viewed = new Set(w.viewed || []);
    });
  } catch(e){}
}
function resetProg(){
  PROG = { onboarded:false, inst:"retail", role:"senior", analyst:"", theme:PROG.theme, textScale:PROG.textScale,
    completed:{}, work:{}, queue:[], genCount:0, seenTypologies:[], sessionStart:Date.now(), lastNav:"dashboard" };
  Object.keys(CASE_CACHE).forEach(k => delete CASE_CACHE[k]);
  saveProg();
}

/* --- live working state per case ----------------------------------------- */
function newWork(caseId, opts){
  const c = getCase(caseId);
  const pr = PRIORITY[c.alert.priority] || PRIORITY.medium;
  const now = Date.now();
  const elapsed = (opts && opts.elapsedH != null ? opts.elapsedH : 0) * 3600000;
  return {
    id:caseId, status:"new", opened:false,
    assignedAt: now - elapsed,
    dueAt: now - elapsed + pr.slaH * 3600000,
    flags:new Set(), asked:[], viewed:new Set(), hints:0,
    notes:[], timeline:[], decision:null, disposition:"", sarRecommended:false,

function work(caseId){

}
function slaState(w){

/* --------------------------------------------------------------------------
   11. Alert queue construction  (§6, §28)
   The queue is multi-case by design: several alerts are live at once, with
   different priorities and different amounts of SLA already consumed, so the
   analyst has to decide what to work first.
   -------------------------------------------------------------------------- */
function buildQueue(force){
  if (!force && PROG.queue && PROG.queue.length) return PROG.queue;
  const instId = PROG.inst;
  let pool = CASE_INDEX.filter(x => x.inst === instId);
  if (pool.length < 8) pool = pool.concat(CASE_INDEX.filter(x => x.inst !== instId));
  const done = PROG.completed;
  const fresh = pool.filter(x => !done[x.id]);
  const ordered = adaptiveOrder(fresh.length ? fresh : pool);
  const take = ordered.slice(0, 12);
  /* stagger how much SLA each alert has already consumed */
  const elapsed = [0, 2, 5, 9, 14, 20, 26, 33, 41, 50, 62, 74];
  PROG.queue = take.map((x, i) => {
    const pr = PRIORITY[x.priority] || PRIORITY.medium;
    const e = Math.min(elapsed[i] || 6, pr.slaH * (i === 3 ? 1.12 : 0.86));
    if (!PROG.work[x.id]) PROG.work[x.id] = newWork(x.id, { elapsedH: e });
    if (i < 3 && PROG.work[x.id].status === "new") PROG.work[x.id].status = "assigned";
    return x.id;
  });
  saveProg();
  return PROG.queue;
}
function queueRows(){
  return (PROG.queue || []).map(id => {
    const c = getCase(id), w = work(id);
    return { c, w, sla: slaState(w) };
  }).filter(r => r.c);
}

/* --------------------------------------------------------------------------
   12. Adaptive engine  (§24)
   -------------------------------------------------------------------------- */
function completedList(){ return Object.keys(PROG.completed).map(k => PROG.completed[k]); }

function weakness(){
  const done = completedList();
  const missFlag = {}, missTyp = {}, seenTyp = {};
  let esc = 0, cls = 0, edd = 0, wrongEsc = 0, wrongCls = 0, n = done.length, scoreSum = 0, overReq = 0;
  done.forEach(r => {
    (r.missedFlags || []).forEach(k => missFlag[k] = (missFlag[k]||0) + 1);
    (r.typology || []).forEach(t => { seenTyp[t] = (seenTyp[t]||0)+1; if (!r.typologyHit) missTyp[t] = (missTyp[t]||0)+1; });
    if (r.decision === "escalate") esc++; if (r.decision === "close") cls++; if (r.decision === "edd") edd++;
    if (r.decision === "escalate" && r.outcome === "close") wrongEsc++;
    if (r.decision === "close" && r.outcome === "escalate") wrongCls++;
    scoreSum += r.score || 0;
    overReq += (r.unnecessary || 0);
  });
  return { n, missFlag, missTyp, seenTyp, esc, cls, edd, wrongEsc, wrongCls,
    avg: n ? scoreSum/n : 0, overReqAvg: n ? overReq/n : 0,
    escRate: n ? esc/n : 0, clsRate: n ? cls/n : 0,
    topMissed: Object.keys(missFlag).sort((a,b)=>missFlag[b]-missFlag[a]).slice(0,4) };
}

function adviceLine(){
  const w = weakness();
  if (!w.n) return "Your first cases are drawn across typologies and difficulty levels. The queue adapts once you have completed a few investigations.";
  if (w.wrongCls >= 2) return "You have closed " + w.wrongCls + " cases where the evidence supported escalation. The queue is now weighted toward cases where the indicators are present but understated.";
  if (w.wrongEsc >= 2) return "You have escalated " + w.wrongEsc + " cases that were reasonably explained. The queue is now weighted toward legitimate-but-unusual activity, so that unusual and suspicious stay distinct.";
  if (w.overReqAvg > 2.5) return "You are averaging " + w.overReqAvg.toFixed(1) + " information requests per case that did not bear on the outcome. Upcoming cases reward a narrower, evidence-led investigation.";
  if (w.topMissed.length) return "Indicators you have most often missed: " + w.topMissed.map(k => FLAG_LABEL[k] || k).join(", ") + ". The queue is weighted toward cases where those indicators are decisive.";
  if (w.avg >= 78) return "Your average is " + Math.round(w.avg) + "/100. The queue is moving toward higher-complexity cases with competing explanations.";
  return "Working across typologies. The queue adjusts as patterns appear in your results.";
}

const FLAG_LABEL = {
  structuring:"structuring below thresholds", passthrough:"pass-through behaviour", unrelated:"unrelated counterparties",
  newbene:"newly added beneficiaries", profile:"profile inconsistency", dormant:"dormancy and reactivation",
  thirdparty:"third-party account use", network:"network and device linkage", explanation:"contradicted explanations",
  cash:"cash intensity", volume:"volume step-change", docs:"documentary inconsistency", geo:"geographic risk",
  shell:"shell and nominee structures", sow:"unevidenced source of wealth", rapid:"rapid movement",
  round:"round-value patterns", circular:"circular flows", mixer:"virtual-asset obfuscation",
  nesting:"correspondent nesting", vulnerable:"customer vulnerability", records:"missing records",
  fop:"free-of-payment settlement", norisk:"absence of economic risk", staleKyc:"stale customer profile"
};

/* order the candidate pool by what the analyst most needs to see next */
function adaptiveOrder(pool){
  const w = weakness();
  const scored = pool.map(x => {
    let s = Math.random() * 0.9;
    if (w.n){
      const targetLevel = w.avg >= 82 ? 5 : w.avg >= 72 ? 4 : w.avg >= 60 ? 3 : w.avg >= 45 ? 2 : 1;
      s += 2.2 - Math.abs(x.level - targetLevel) * 0.7;
      if (w.wrongCls >= 2 && x.outcome === "escalate") s += 1.4;
      if (w.wrongEsc >= 2 && x.outcome === "close") s += 1.8;
      if (w.escRate > 0.75 && x.outcome !== "escalate") s += 1.2;
      if (w.clsRate > 0.6 && x.outcome === "escalate") s += 1.2;
    } else {
      s += x.level <= 2 ? 1.6 : x.level === 3 ? 0.6 : 0;
    }
    return { x, s };
  });
  scored.sort((a,b) => b.s - a.s);
  /* keep a spread of priorities in the queue rather than 12 criticals */
  const out = [], byPr = { critical:0, high:0, medium:0, low:0 };
  scored.forEach(({x}) => {
    const cap = { critical:3, high:5, medium:5, low:3 }[x.priority] || 4;
    if (byPr[x.priority] < cap){ out.push(x); byPr[x.priority]++; }
  });
  scored.forEach(({x}) => { if (out.indexOf(x) < 0) out.push(x); });
  return out;
}

/* --------------------------------------------------------------------------
   13. Scoring and QA review  (§20, §25, §33)
   -------------------------------------------------------------------------- */
const STOP = new Set(("the a an and or of to in on for with by from is are was were be been that this those these it its as at " +
  "not no than then them they their our your you we he she his her which who whom whose into over under about across within " +
  "without have has had do does did but if when while there here also more most some any all such very can could would should").split(" "));
function tokens(s){ return String(s).toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w => w.length > 4 && !STOP.has(w)); }

function matchesFlag(text, flag){
  const t = " " + text.toLowerCase() + " ";
  const key = (FLAG_LABEL[flag.k] || flag.k).toLowerCase();
  if (t.indexOf(key.split(" ")[0]) >= 0 && key.split(" ")[0].length > 4) return true;
  const words = uniq(tokens(flag.t)).filter(w => w.length > 5);
  if (!words.length) return false;
  let hit = 0; words.forEach(w => { if (t.indexOf(w) >= 0) hit++; });
  return hit / words.length >= 0.28 || hit >= 3;
}

const ASSUMPTION_PATTERNS = [
  { re:/\b(is|are)\s+(money laundering|laundering money|a criminal|criminals|guilty)\b/i, t:"States a conclusion of criminality. The analyst records suspicion and escalates; guilt is not an analyst determination." },
  { re:/\b(definitely|certainly|obviously|clearly proves|proves that|without doubt|no doubt)\b/i, t:"Uses absolute language where the evidence supports a qualified statement." },
  { re:/\bconfirmed (sanctions )?match\b/i, t:"Describes a match as confirmed. Check whether the Sanctions Team actually confirmed it." },
  { re:/\b(criminal|drug|terrorist|trafficking) (proceeds|funds|money)\b/i, t:"Characterises the funds as proceeds of a specific crime. State what the evidence shows and identify the typology as potential." },
  { re:/\bthe customer is (a )?(mule|launderer|fraudster|criminal)\b/i, t:"Labels the customer. Describe the account behaviour instead." }
];
const QUALITY_TERMS = ["counterparty","beneficiary","typology","source of funds","source of wealth","expected activity",
  "profile","threshold","review period","pass-through","structuring","escalat","enhanced due diligence","screening",
  "corroborat","reconcil","inconsistent","documentation","evidence","rationale","baseline","materiality"];

function evaluateCase(c, w){
  const disp = w.disposition || "";
  const notesText = (w.notes || []).map(n => n.body).join(" ");
  const all = disp + " " + notesText;
  const D = {};

  /* 1. transaction analysis --------------------------------------------- */
  const flagged = Array.from(w.flags || []);
  const key = c.keyTxn || [];
  const hit = flagged.filter(id => key.indexOf(id) >= 0).length;
  const recall = key.length ? hit / key.length : (flagged.length ? 0.5 : 0);
  const precision = flagged.length ? hit / flagged.length : 0;
  const covered = w.viewed && w.viewed.has("txn") ? 1 : 0.55;
  D.txn = clamp((recall * 0.62 + precision * 0.24 + covered * 0.14) * 100, 0, 100);

  /* 2. red flags --------------------------------------------------------- */
  const found = (c.flags || []).filter(f => matchesFlag(all, f));
  const missed = (c.flags || []).filter(f => found.indexOf(f) < 0);
  D.flags = c.flags && c.flags.length ? (found.length / c.flags.length) * 100 : 60;

  /* 3. typology ---------------------------------------------------------- */
  const typHit = (c.typology || []).some(t => {
    const words = tokens(t);
    return words.length && words.filter(x => all.toLowerCase().indexOf(x) >= 0).length / words.length >= 0.4;
  });
  const noTypNeeded = c.outcome === "close";
  D.typ = typHit ? 100 : (noTypNeeded && /no (money laundering )?typolog|not indicat|reasonably explained/i.test(all) ? 92 : 26);

  /* 4. investigation coverage -------------------------------------------- */
  const askedIds = (w.asked || []).map(a => a.id);
  const keyReq = c.keyReq || [];
  const keyHit = keyReq.filter(k => askedIds.indexOf(k) >= 0).length;
  const unnecessary = Math.max(0, askedIds.length - keyHit - 2);
  D.inv = clamp((keyReq.length ? keyHit / keyReq.length : 0.6) * 100 - unnecessary * 5, 0, 100);

  /* 5. evidence handling ------------------------------------------------- */
  let ev = 0;
  if (askedIds.indexOf("sanc") >= 0) ev += 22;
  if (askedIds.indexOf("media") >= 0) ev += 22;
  if (askedIds.indexOf("sofsow") >= 0 || askedIds.indexOf("proof") >= 0) ev += 26;
  if (w.viewed && w.viewed.has("docs")) ev += 16;
  if (w.viewed && w.viewed.has("entities")) ev += 14;
  if (c.sanctions.kind === "potential" && /potential match|not (a )?confirmed|cannot be treated as confirmed/i.test(all)) ev = Math.min(100, ev + 12);
  if (c.media.kind === "unconfirmed" && /uncorroborat|unconfirmed|not evidence|requires? (further )?investigation/i.test(all)) ev = Math.min(100, ev + 12);
  D.ev = clamp(ev, 0, 100);

  /* 6. decision ---------------------------------------------------------- */
  const dec = w.decision;
  const rank = { close:0, edd:1, escalate:2 };
  const dist = Math.abs((rank[dec] != null ? rank[dec] : 1) - rank[c.outcome]);
  D.dec = dec === c.outcome ? 100 : dist === 1 ? 55 : 12;

  /* 7. disposition writing ------------------------------------------------ */
  const words = disp.trim() ? disp.trim().split(/\s+/).length : 0;
  let dq = 0;
  dq += clamp(words / 260, 0, 1) * 30;
  const terms = QUALITY_TERMS.filter(t => disp.toLowerCase().indexOf(t) >= 0).length;
  dq += clamp(terms / 9, 0, 1) * 24;
  const structure = [/alert|rule|trigger/i, /profile|customer|occupation|expected/i, /transaction|credit|debit|counterpart/i,
    /explanation|customer (stated|said)|account given/i, /evidence|document|corroborat|statement/i,
    /recommend|escalat|clos|enhanced due diligence/i];
  dq += (structure.filter(re => re.test(disp)).length / structure.length) * 30;
  const assumptions = ASSUMPTION_PATTERNS.filter(p => p.re.test(disp));
  dq -= assumptions.length * 9;
  if (/contradict|inconsistent with|does not reconcile|not supported by/i.test(disp)) dq += 8;
  if (/however|although|on the other hand|against that/i.test(disp)) dq += 8;
  D.disp = clamp(dq, 0, 100);

  /* 8. documentation ------------------------------------------------------ */
  const noteKinds = uniq((w.notes||[]).map(n => n.kind)).length;
  let doc = clamp((w.notes||[]).length / 5, 0, 1) * 44 + clamp(noteKinds / 5, 0, 1) * 34;
  doc += clamp((w.timeline||[]).length / 14, 0, 1) * 22;
  D.doc = clamp(doc, 0, 100);

  const dims = [
    { k:"txn",   label:"Transaction analysis",            wgt:16, v:D.txn },
    { k:"flags", label:"Red-flag identification",         wgt:16, v:D.flags },
    { k:"typ",   label:"Typology identification",         wgt:11, v:D.typ },
    { k:"inv",   label:"Investigation quality and scope", wgt:13, v:D.inv },
    { k:"ev",    label:"Evidence and screening handling", wgt:11, v:D.ev },
    { k:"dec",   label:"Decision quality",                wgt:17, v:D.dec },
    { k:"disp",  label:"Disposition writing",             wgt:11, v:D.disp },
    { k:"doc",   label:"Documentation and audit trail",   wgt:5,  v:D.doc }
  ];
  const score = Math.round(sum(dims, d => d.v * d.wgt) / sum(dims, d => d.wgt));

  /* traps the analyst fell into */
  const trapsHit = (c.traps || []).filter(t => {
    const words = tokens(t.t).slice(0,6);
    return words.length && words.filter(x => disp.toLowerCase().indexOf(x) >= 0).length >= Math.ceil(words.length*0.5)
      && !/discount|not (itself |in itself )?suspicious|ordinary|expected|consistent with/i.test(disp);
  });

  const critical = [];
  if (dec === "close" && c.outcome === "escalate") critical.push("Case closed where the evidence supported escalation. On these facts the activity remained unexplained and reportable.");
  if (dec === "escalate" && c.outcome === "close") critical.push("Case escalated where the activity was reasonably explained and independently corroborated. Escalating explained activity consumes MLRO capacity and, at scale, degrades the value of reporting.");
  if (c.sanctions.kind === "potential" && /confirmed (sanctions )?match/i.test(disp)) critical.push("A potential sanctions match was described as confirmed. The Sanctions Team owns that determination.");
  if (assumptions.length) assumptions.forEach(a => critical.push(a.t));
  if (!disp.trim()) critical.push("No written disposition was provided. The written record is the deliverable; an undocumented decision cannot be reviewed, audited or relied on.");
  if (askedIds.indexOf("explain") < 0 && c.outcome !== "close" && ROLES[PROG.role].can.requestCustomer)
    critical.push("The customer's own account of the activity was never sought, so the explanation was never tested.");

  const strengths = [];
  if (D.txn >= 75) strengths.push("Transaction selection was accurate — the movements you flagged are the ones that carry the case.");
  if (D.flags >= 75) strengths.push("Most of the indicators present were identified and articulated.");
  if (D.inv >= 78) strengths.push("Investigation was well targeted: the actions taken bore on the outcome.");
  if (D.disp >= 72) strengths.push("The disposition is structured, evidence-led and appropriately qualified.");
  if (dec === c.outcome) strengths.push("Decision matches the risk-based outcome supported by the evidence.");
  if (D.ev >= 75) strengths.push("Screening and evidence were handled properly, including the distinction between information and proof.");
  if (!strengths.length) strengths.push("You reached a decision and recorded it, which is where every investigation has to start.");

  const verdict = score >= 75 ? "Pass" : score >= 60 ? "Borderline" : "Fail";
  const learn = missed.length ? (FLAG_LABEL[missed[0].k] || missed[0].k)
    : D.disp < 60 ? "disposition writing and evidence-led reasoning"
    : D.inv < 60 ? "targeting the investigation" : "maintaining accuracy at higher complexity";

  return { score, verdict, dims, found, missed, typHit, unnecessary, critical, strengths, trapsHit, learn,
    keyHit, keyReqTotal: keyReq.length, askedCount: askedIds.length, words };
}

function qaNarrative(c, ev, w){
  const P = [];
  P.push("Reviewed: " + c.alert.ref + " — " + c.title + ". Analyst decision: " + (OUTCOME_NAME[w.decision] || "none recorded") +
    ". Risk-based outcome supported by the evidence: " + OUTCOME_NAME[c.outcome] + ".");
  if (ev.critical.length) P.push("Critical findings. " + ev.critical.join(" "));
  else P.push("No critical findings. The investigation reached a defensible position on the evidence gathered.");
  P.push("Coverage. " + ev.keyHit + " of " + ev.keyReqTotal + " material investigation steps were taken, from " +
    ev.askedCount + " actions in total" + (ev.unnecessary > 0 ? ", of which approximately " + ev.unnecessary +
    " did not bear on the outcome. Investigative effort is finite and unnecessary requests delay other cases in the queue." : ".") );
  if (ev.missed.length) P.push("Indicators not addressed. " + ev.missed.map(f => f.t).join(". ") + ".");
  if (ev.trapsHit.length) P.push("Points treated as indicators that should have been discounted. " + ev.trapsHit.map(t => t.t).join(" "));
  P.push("Documentation. " + (ev.words ? "The disposition runs to " + ev.words + " words. " : "No disposition was written. ") +
    "The record should let a reader who has never seen the account understand what was reviewed, what was found, what the customer said, what the evidence showed and why the decision follows.");
  P.push("Strengths. " + ev.strengths.join(" "));
  P.push("Recommended focus. " + ev.learn + ".");
  return P.join("\n\n");
}

  const rnd = seedRand(id);
